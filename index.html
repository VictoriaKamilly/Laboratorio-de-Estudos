<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratório de Estudos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef4f6; --card:#ffffff; --ink:#1d3540; --mut:#5f7680; --line:#d6e2e7;
  --teal:#1d6b7a; --teal2:#2b8a9c; --ok:#2e9e6b; --bad:#d0544b; --gold:#f0b33e;
  --side:#173f4a; --side2:#1f5361;
  --acc:#1d6b7a; --acc2:#2b8a9c; --acc3:#f0b33e; --accbg:#e3f4f7;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif}
button{font-family:inherit}
[hidden]{display:none!important}
.hint{font-size:13px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.card h2{font-size:13.5px;margin:0 0 8px;text-transform:uppercase;letter-spacing:1.2px;color:var(--teal);font-weight:900}
.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--teal);color:#fff;font-weight:900;font-size:14px;cursor:pointer}
.btn.sec{background:#e8eff2;color:var(--ink)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.hb{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:800;font-size:13.5px;color:var(--ink);cursor:pointer}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:800;font-size:14px;opacity:0;transition:opacity .25s;z-index:200;max-width:92vw;text-align:center;pointer-events:none}
.toast.show{opacity:1}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .35s}

/* ---------- login ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.lbox{background:#fff;border-radius:24px;padding:24px 20px;max-width:560px;width:100%;box-shadow:0 20px 50px rgba(20,40,50,.12);border:1px solid var(--line)}
.lbrand{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.lbrand .logo{width:54px;height:54px;border-radius:16px;background:var(--teal);display:flex;align-items:center;justify-content:center;font-size:30px;flex:0 0 auto}
.lbrand h1{margin:0;font-size:26px;font-weight:900;line-height:1.1}
.lbrand small{display:block;font-size:13px;color:var(--mut);font-weight:700}
.ugrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.ubtn{border:2.5px solid var(--line);background:#fff;border-radius:18px;padding:16px 10px;font-weight:900;font-size:18px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .12s,border-color .12s}
.ubtn:hover{transform:translateY(-2px);border-color:var(--teal2)}
.ubtn .ic{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff}
.ubtn small{font-weight:700;color:var(--mut);font-size:12px}
.pinwrap{text-align:center;margin-top:8px}
.pinwho{font-size:22px;font-weight:900;margin-top:6px}
.pindots{display:flex;gap:14px;justify-content:center;margin:12px 0 6px}
.pindots i{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--teal);display:inline-block}
.pindots i.on{background:var(--teal)}
.pinmsg{min-height:20px;font-size:13.5px;font-weight:800;color:var(--bad)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px auto 0;max-width:300px}
.pinpad button{height:58px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:22px;font-weight:900;cursor:pointer;color:var(--ink)}
.pinpad button:active{background:var(--accbg)}

/* ---------- app shell ---------- */
#app{display:grid;grid-template-columns:262px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--side);color:#fff;padding:16px 12px;display:flex;flex-direction:column;gap:6px;z-index:80}
.side .brand{display:flex;align-items:center;gap:10px;padding:2px 6px 12px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:6px}
.side .brand b{font-size:17px;font-weight:900;line-height:1.1}
.side .brand small{display:block;font-size:11.5px;opacity:.75;font-weight:700}
.side .brand .logo{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:22px}
.navi{display:flex;align-items:center;gap:10px;color:#e6f1f3;text-decoration:none;border-radius:12px;padding:10px 12px;font-weight:800;font-size:15px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.navi:hover{background:rgba(255,255,255,.08)}
.navi.on{background:#fff;color:var(--side)}
.navi .ni{width:22px;text-align:center;font-size:17px}
.navgrp{margin-top:6px}
.navgrp .gt{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;opacity:.65;font-weight:900;padding:8px 12px 4px;display:flex;align-items:center;gap:8px}
.navsub{padding-left:10px;display:flex;flex-direction:column;gap:2px}
.navsub .navi{font-size:14.5px;padding:8px 12px}
.navsub .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.side .who{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding:12px 6px 0;display:flex;align-items:center;gap:10px}
.side .who .av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;flex:0 0 auto}
.side .who b{display:block;font-size:14.5px}
.side .who small{font-size:11.5px;opacity:.75;font-weight:700}
.side .who button{margin-left:auto;border:1px solid rgba(255,255,255,.35);background:none;color:#fff;border-radius:10px;padding:6px 10px;font-weight:800;cursor:pointer;font-size:12.5px}
.main{min-width:0;padding:14px 18px 40px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top h1{margin:0;font-size:22px;font-weight:900;flex:1;min-width:0}
.burger{display:none;border:2px solid var(--line);background:#fff;border-radius:12px;width:44px;height:44px;font-size:20px;cursor:pointer}
.scrim{display:none}
@media (max-width:880px){
  #app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:276px;transform:translateX(-102%);transition:transform .22s}
  body.navopen .side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  body.navopen .scrim{display:block;position:fixed;inset:0;background:rgba(10,30,40,.45);z-index:70}
  .burger{display:inline-flex;align-items:center;justify-content:center}
  .main{padding:12px 12px 40px}
  .top h1{font-size:19px}
}
.wrapv{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* ---------- cronograma ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:900;font-size:14px;cursor:pointer;color:var(--ink)}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:12.5px;font-weight:800;align-items:center}
.bdg{display:inline-flex;align-items:center;gap:4px;border-radius:7px;padding:2px 8px;font-size:11.5px;font-weight:900;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap}
.b-prova{background:#ffe2bd;color:#8a4b00}
.b-reforco{background:#1f4f5c;color:#fff}
.b-missao{background:#e2f4e7;color:#1f6e43;border:1px solid #9bd3b2}
.b-leitura{background:#eef1f6;color:#4a5a73}
.b-estrela{background:#f1e6ff;color:#6a3aa8}
.b-evento{background:#fff3c4;color:#7a5a00}
.b-aula{background:#e8eef9;color:#2b4a8a}
.b-tarefa{background:#eef6f8;color:#2b6878;border:1px solid #c9dbe1}
.tl{display:flex;flex-direction:column}
.tlrow{display:grid;grid-template-columns:78px 22px minmax(0,1fr);gap:0 10px;align-items:start}
.tlrow .dt{text-align:right;font-weight:900;font-size:16px;padding-top:6px;line-height:1.1}
.tlrow .dt small{display:block;font-size:10.5px;letter-spacing:1.2px;color:var(--mut)}
.tlrow .ln{position:relative;align-self:stretch}
.tlrow .ln::before{content:'';position:absolute;left:10px;top:0;bottom:0;width:3px;background:#d3e0e5}
.tlrow .ln i{position:absolute;left:3px;top:9px;width:17px;height:17px;border-radius:50%;border:3px solid #1f4f5c;background:#fff}
.tlrow .ln i.full{background:var(--gold);border-color:var(--gold)}
.tlrow.today .dt{color:var(--bad)}
.tlrow.today .ln i{border-color:var(--bad);background:var(--bad)}
.tlrow.past{opacity:.6}
.tlitems{display:flex;flex-direction:column;gap:6px;padding:4px 0 16px}
.tli{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;font-size:14.5px;line-height:1.35}
.tli b{font-weight:900}
.tli .d{color:var(--mut);font-size:13px;font-weight:700}
.tag{display:inline-block;font-size:10.5px;font-weight:900;border-radius:999px;padding:1px 8px;color:#fff}
.tag.j{background:#10233f}.tag.s{background:#7b5fae}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pc{border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff}
.pc .h{display:flex;gap:8px;align-items:center;font-weight:900;font-size:15px}
.pc .h .dd{background:#1f4f5c;color:#fff;border-radius:8px;padding:2px 7px;font-size:12px}
.pc .c{font-size:13px;color:var(--mut);margin-top:4px;line-height:1.4}
.tip{border-left:5px solid var(--gold);background:#fff8e6;border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.45}
.tip.j{border-left-color:#8bc34a;background:#f1f8e9}
.tip.s{border-left-color:#e07aa9;background:#fbf0fa}

/* ---------- agenda ---------- */
.ag.joao{--acc:#10233f;--acc2:#8bc34a;--acc3:#ff9f2e;--accbg:#fff1df;--provabg:#fff5e8}
.ag.sofia{--acc:#7b5fae;--acc2:#e07aa9;--acc3:#e07aa9;--accbg:#f4ecff;--provabg:#fdf0f7}
.aghead{background:var(--acc);color:#fff;border-radius:18px;padding:16px 18px;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden}
.aghead .k{font-size:11.5px;letter-spacing:3px;font-weight:900;color:var(--acc2);text-transform:uppercase}
.aghead h2{margin:2px 0;font-size:26px;font-weight:900;line-height:1.1}
.aghead .sub{font-size:13px;opacity:.85;font-weight:700}
.aghead .badge{margin-left:auto;width:68px;height:68px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:36px;flex:0 0 auto;border:6px solid var(--acc2);color:var(--acc)}
.aghead .nm{color:var(--acc3);font-weight:900;letter-spacing:4px;font-size:13px;text-transform:uppercase}
.ag.sofia .aghead .nm{color:#ffc2e0}
.calbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.calbar .mt{font-size:20px;font-weight:900;flex:1;min-width:150px;text-transform:capitalize}
.calbar .nb{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:20px;font-weight:900;cursor:pointer;color:var(--ink)}
.prog{height:10px;background:#e6eef1;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc2);border-radius:99px;transition:width .3s}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wd{background:var(--acc);color:#fff;text-align:center;font-size:11px;font-weight:900;border-radius:8px;padding:6px 0;letter-spacing:1.5px}
.cell{background:#fff;border:2px solid var(--line);border-radius:12px;min-height:112px;padding:5px 6px 6px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;position:relative;transition:border-color .12s}
.cell:hover{border-color:#b9cdd4}
.cell.blank{background:transparent;border:2px dashed #dfe8eb;cursor:default}
.cell.we{background:#f4f7f9}
.cell.hasprova{border-color:var(--acc3);background:var(--provabg)}
.cell.sel{box-shadow:0 0 0 3px var(--acc2);border-color:var(--acc2)}
.cell .dn{font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:space-between;gap:4px}
.cell.today .dn span{background:var(--acc);color:#fff;border-radius:999px;padding:0 8px}
.cell .gol{font-size:14px;line-height:1}
.it{display:flex;gap:4px;align-items:flex-start;font-size:11.5px;font-weight:800;line-height:1.2;border-radius:6px;padding:2px 4px;min-width:0}
.it input{margin:1px 0 0;flex:0 0 auto;width:14px;height:14px;cursor:pointer;accent-color:var(--acc)}
.it span{min-width:0;overflow-wrap:anywhere}
.it.done span{text-decoration:line-through;opacity:.55}
.t-prova{background:#ffe8cc;color:#7a4300}
.t-reforco{background:var(--acc);color:#fff}
.t-reforco input{accent-color:#fff}
.t-missao{background:#e2f4e7;color:#1f6e43}
.t-leitura{background:#eef1f6;color:#4a5a73}
.t-estrela{background:#f1e6ff;color:#6a3aa8}
.t-evento{background:#fff3c4;color:#6d5000}
.t-tarefa{background:#eef6f8;color:#2b6878}
.t-aula{color:#fff}
.dots{display:none;gap:3px;flex-wrap:wrap;margin-top:2px}
.dots i{width:8px;height:8px;border-radius:50%;display:inline-block}
.dots i.ok{opacity:.35}
@media (max-width:760px){
  .cal{gap:3px}
  .cal .wd{font-size:9.5px;letter-spacing:.5px;padding:5px 0}
  .cell{min-height:62px;padding:3px 4px;border-radius:9px}
  .cell .dn{font-size:13.5px}
  .cell .it{display:none}
  .cell .dots{display:flex}
  .aghead h2{font-size:21px}
  .aghead .badge{width:54px;height:54px;font-size:28px;border-width:4px}
}
.daybox{border-top:6px solid var(--acc)}
.daybox .dh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.daybox .dh b{font-size:20px;font-weight:900}
.daybox .dh b::first-letter{text-transform:uppercase}
.drow{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:9px 11px;margin-top:6px;background:#fff}
.drow input[type=checkbox]{width:22px;height:22px;margin:1px 0 0;flex:0 0 auto;accent-color:var(--acc);cursor:pointer}
.drow .tx{flex:1;min-width:0}
.drow .tx b{font-size:15px;display:block;line-height:1.3}
.drow .tx .d{font-size:13px;color:var(--mut);margin-top:2px;line-height:1.4}
.drow.done{background:#f3fbf6;border-color:#bfe5cd}
.drow.done .tx b{text-decoration:line-through;opacity:.7}
.drow .del{border:0;background:#f4e6e4;color:var(--bad);border-radius:8px;font-weight:900;cursor:pointer;padding:4px 8px;font-size:12px}
.addf{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:6px;margin-top:10px}
@media (max-width:560px){.addf{grid-template-columns:1fr 1fr}.addf input{grid-column:1/-1}}
.addf input,.addf select{border:2px solid var(--line);border-radius:10px;padding:9px 10px;font-family:inherit;font-size:14px;min-width:0;background:#fff;color:var(--ink)}
.rot{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:6px}
@media (max-width:560px){.rot{grid-template-columns:1fr}}
.rot label{display:flex;gap:8px;align-items:flex-start;font-weight:800;font-size:14px;padding:5px 0;cursor:pointer}
.rot label.full{grid-column:1/-1}
.rot input{width:19px;height:19px;margin:0;flex:0 0 auto;accent-color:var(--acc)}
.golbox{display:flex;align-items:center;gap:10px;margin-top:10px;border:2px dashed var(--acc3);border-radius:14px;padding:8px 12px;font-weight:900}
.golbox .g{font-size:26px;filter:grayscale(1);opacity:.35}
.golbox.on{border-style:solid;background:var(--accbg)}
.golbox.on .g{filter:none;opacity:1}
.visto{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;font-weight:800;font-size:14px}
.visto .ok{color:var(--ok)}
.sec2{margin-top:14px;font-size:12.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mut);font-weight:900}

/* ---------- disciplinas ---------- */
.dhead{border-radius:18px;padding:16px 18px;color:#fff;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dhead .ic{width:58px;height:58px;border-radius:16px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:32px}
.dhead h2{margin:0;font-size:26px;font-weight:900}
.dhead .sub{font-size:13.5px;font-weight:700;opacity:.9}
.dtabs .tab.on{background:var(--sc);border-color:var(--sc)}
.chap{margin-top:8px}
.chap h3{font-size:15px;margin:10px 0 4px;color:var(--sc)}
.trow{display:flex;align-items:center;gap:10px;border-bottom:1px solid #edf2f4;padding:7px 2px;font-size:14.5px;font-weight:700}
.trow .cks{display:flex;gap:6px;flex:0 0 auto}
.trow .cks input{width:20px;height:20px;margin:0;accent-color:var(--sc);cursor:pointer}
.trow .who2{display:flex;gap:6px;flex:0 0 auto;font-size:12px;font-weight:900}
.trow .who2 span{border-radius:999px;padding:1px 8px;background:#eef3f5;color:var(--mut)}
.trow .who2 span.r{background:#fff1d6;color:#8a5a00}
.trow .who2 span.s{background:#e2f4e7;color:#1f6e43}
.links{display:flex;gap:8px;flex-wrap:wrap}
.lnk{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:900;font-size:14.5px}
.lnk:hover{border-color:var(--sc)}
/* flashcards */
.flip{perspective:1200px;max-width:600px;margin:0 auto;cursor:pointer;user-select:none;-webkit-user-select:none;width:100%}
.flip .in{position:relative;height:310px;transition:transform .5s;transform-style:preserve-3d}
.flip.back .in{transform:rotateY(180deg)}
.flip .fa{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;border:2.5px solid var(--line);background:#fff;padding:18px 20px;display:flex;flex-direction:column;box-shadow:0 6px 18px rgba(29,53,64,.08)}
.flip .fb{transform:rotateY(180deg)}
.flip .fa.star{background:linear-gradient(135deg,#fbf3ff,#fff0f7);border-color:#d9c2f5}
.flip .top2{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:900;color:var(--sc)}
.flip .top2 .n{color:#fff;background:var(--sc);border-radius:8px;padding:1px 9px}
.flip .q{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:23px;font-weight:900;line-height:1.3;padding:0 6px}
.flip .tap{font-size:12px;color:var(--mut);text-align:center}
.flip .ans{font-size:16.5px;font-weight:800;line-height:1.4;margin-top:8px}
.flip .pz{margin-top:10px;border-radius:12px;padding:8px 11px;font-size:14.5px;line-height:1.35;background:#f3f7f9}
.flip .pz b{color:var(--sc)}
.flip .ex{margin-top:8px;font-size:13.5px;font-style:italic;color:#4d6670}
@media (max-width:560px){.flip .in{height:340px}.flip .q{font-size:19.5px}}
.fctrl{display:flex;justify-content:center;align-items:center;gap:10px;margin:12px 0 4px;flex-wrap:wrap}
.fctrl .nb{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:22px;font-weight:900;cursor:pointer;color:var(--ink)}
.fctrl .ct{font-weight:900;min-width:70px;text-align:center}
.fpile{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.fpile button{border:0;border-radius:12px;padding:10px 14px;font-weight:900;font-size:14px;cursor:pointer}
.fpile .ok2{background:#e3f5ea;color:#1f7a50}
.fpile .rv{background:#fdecd8;color:#9a5a12}
.fpile .ot{background:#eef3f5;color:var(--ink)}
.fpile .ot.on{background:var(--sc);color:#fff}
.fstat{text-align:center;font-size:13px;color:var(--mut);margin-top:8px;font-weight:700}
.mark{display:inline-block;font-size:11px;font-weight:900;border-radius:999px;padding:1px 8px;margin-left:6px}

/* jogos */
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.gcard{border:2px solid var(--line);border-radius:16px;padding:12px 14px;background:#fff;cursor:pointer;display:flex;flex-direction:column;gap:4px;text-align:left;color:var(--ink);transition:border-color .12s,transform .12s}

.gcard .rec{font-size:12px;font-weight:900;color:var(--sc);margin-top:4px}
.gq{font-size:21px;font-weight:900;line-height:1.35;margin:6px 0 4px}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:800;font-size:14.5px;cursor:pointer;color:var(--ink)}
.chip.on{border-color:var(--sc);background:#f1f6f8;box-shadow:inset 0 0 0 1px var(--sc)}
.chip.good{border-color:var(--ok);background:#eaf7ef}

.pista{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-family:inherit;font-size:15px;margin-top:4px}
.pista:focus,.ans-in:focus{outline:none;border-color:var(--sc)}
.ans-in{border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-family:inherit;font-size:18px;font-weight:900;width:180px;max-width:100%}
.fbk{margin-top:10px;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45}
.fbk.ok{background:#eaf7ef;border:1px solid #9bd3b2}
.fbk.no{background:#fff1ef;border:1px solid #f0b2ab}
.fbk.warn{background:#fff8e6;border:1px solid #f1d38a}
.focus{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:10px}
.focus div{border-radius:12px;padding:8px 11px;font-size:13px;line-height:1.4}
.focus .j{background:#f1f8e9;border:1px solid #c5e1a5}
.focus .s{background:#f6effc;border:1px solid #d9c2f5}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.score{display:inline-block;background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:900;font-size:13.5px;color:#a46d00}
.seq{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.seq button{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;font-weight:800;font-size:14.5px;cursor:pointer;color:var(--ink)}
.seq button .n{width:26px;height:26px;border-radius:50%;background:var(--sc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 auto}
.seq.pool button .n{background:#d6e2e7;color:var(--mut)}
.nota{font-size:44px;font-weight:900;color:var(--sc)}
/* turnê + tabela */
.tour{width:100%;border-collapse:separate;border-spacing:0 6px}
.tour th{font-size:12px;color:#fff;background:#7b5fae;padding:7px;text-align:center}
.tour th:first-child{border-radius:10px 0 0 10px}.tour th:last-child{border-radius:0 10px 10px 0}
.tour td{background:#f6effc;padding:6px;text-align:center}
.tour td:first-child{font-weight:900;font-size:18px;color:#5b3f8f;border-radius:10px 0 0 10px}
.tour td:last-child{border-radius:0 10px 10px 0}
.tstar{width:40px;height:40px;border-radius:50%;border:2px dashed #b9a2dc;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:20px;color:#7b5fae;cursor:default}
.tstar.can{cursor:pointer}
.tstar.on{border-style:solid;background:#7b5fae;color:#fff}
.tour small{display:block;font-size:11px;color:#7b5fae;font-weight:800;min-height:14px}
.difs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:6px}
.difs label{display:flex;align-items:center;gap:8px;border:2px solid #e3d6f5;border-radius:10px;padding:7px 10px;font-weight:900;background:#fff}
.difs label.ok{background:#eaf7ef;border-color:#9bd3b2}
.ladder{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin:4px 0 10px}
.ladder span{color:#fff;text-align:center;font-weight:900;font-size:13.5px;padding:8px 2px;border-radius:6px}
.ladder span.u{background:#f0b33e!important;color:#3d2a00}
/* ---------- padrão das matérias (referência: Laboratório de Misturas) ---------- */
.disc{display:flex;flex-direction:column;gap:14px;--acc2:var(--sc);max-width:920px;width:100%;margin:0 auto}
#dBody{display:flex;flex-direction:column;gap:14px}
.vcard{width:100%}
.card h2.vh{font-size:20px;font-weight:900;margin:0 0 4px;text-transform:none;letter-spacing:0;color:var(--ink)}
.vsub{color:var(--mut);font-size:14px;margin:0 0 10px;line-height:1.45}

.qtools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

.scene .tx{font-size:19px;font-weight:900;line-height:1.35;min-width:0}
.gsub{font-size:13.5px;color:var(--mut);font-weight:700;margin-bottom:6px}
.endbig{font-size:44px;line-height:1;margin-top:6px}
.busca{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-family:inherit;font-size:15px;margin-bottom:4px}
.busca:focus{outline:none;border-color:var(--sc)}
.gl div{border-bottom:1px solid #edf2f4;padding:9px 2px;font-size:14px;line-height:1.45}

.gl i{color:var(--mut)}
.dtabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}

.kidchip{border-radius:999px;padding:6px 12px;font-weight:900;font-size:13px;background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.5);white-space:nowrap}

/* ---------- jogos visuais de Ciências (padrão do Laboratório de Misturas) ---------- */
.qwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:center;margin-top:6px}
.qwrap.one{grid-template-columns:1fr}
@media (max-width:640px){.qwrap{grid-template-columns:1fr}}

.mitem .bb button:hover{border-color:var(--sc)}
.mitem.ok{border-color:var(--ok);background:#f2fbf6}
.mitem.no{border-color:var(--bad);background:#fff6f4}
.mitem .res{font-weight:900;font-size:13.5px}
.mitem .res.g{color:var(--ok)} .mitem .res.b{color:var(--bad)}
.mitem .ask{font-weight:900;font-size:12.5px;margin:8px 0 4px}

.spool{display:flex;flex-wrap:wrap;gap:8px;padding:10px;background:#f7fbfc;border:2px dashed var(--line);border-radius:16px;min-height:96px;margin:6px 0 12px;align-items:flex-start}
.scard{width:116px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px 4px;text-align:center;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;position:relative;transition:transform .12s,box-shadow .12s}
.spool .scard:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(29,53,64,.12)}
.scard.sel{border-color:var(--gold);background:#fff8e6;box-shadow:0 0 0 4px rgba(240,179,62,.3)}
.scard.dragging{opacity:.3}
.sthumb svg{width:72px;height:66px;display:block;margin:0 auto}
.sname{font-size:12px;font-weight:900;line-height:1.2}
.sghost{position:fixed;left:0;top:0;z-index:300;pointer-events:none;box-shadow:0 12px 26px rgba(0,0,0,.28);margin:0}
.sboard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:620px){.sboard{grid-template-columns:1fr}}
.scol{border:2.5px solid var(--line);border-radius:16px;padding:8px;background:#fff;min-height:150px;cursor:pointer;transition:background .15s,border-color .15s}
.sboard.sdrag .scol{border-style:dashed;border-color:#c9dbe1}
.scol.hov{border-style:solid!important;border-color:var(--gold)!important;background:#fff4d6}
.sch{display:flex;gap:8px;align-items:center;margin-bottom:6px;line-height:1.2}
.sch .sem{font-size:28px}
.sch small{display:block;font-size:11.5px;color:var(--mut);font-weight:700}
.sin{display:flex;flex-wrap:wrap;gap:6px}
.sin .scard{width:94px;cursor:default;touch-action:auto}
.sin .sthumb svg{width:54px;height:50px}
.scard.okp{border-color:var(--ok);background:#f2fbf6}
.scard.shown{border-color:#9bb8d6;background:#eef4fb}
.smark{position:absolute;top:2px;right:6px;font-weight:900;color:var(--ok);font-size:13px}
.gcard.big{padding:10px 12px 12px}
.gcard.big .gill{display:flex;align-items:center;justify-content:center;gap:4px;height:100px;border-radius:12px;background:#eef8f2;margin-bottom:6px;overflow:hidden}
.gcard.big .gill svg{height:92px;width:auto;max-width:48%}
.gcard.big .gill .ems{font-size:30px;letter-spacing:2px}
.embed{border:2px solid var(--line);border-radius:16px;overflow:hidden;height:min(80vh,900px);min-height:520px;background:#eef4f6}
.embed iframe{width:100%;height:100%;border:0;display:block}
/* ---------- jogo de Misturas (estilos do Laboratório de Misturas, limitados a .mx) ---------- */
.disc.wide{max-width:1180px}
.mx .mxwrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
@media (max-width:900px){.mx .mxwrap{grid-template-columns:1fr}}
.mx .mxcol,.mx .panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.mx .hint{margin:-2px 0 8px}
.mx .shelf{display:flex;flex-wrap:wrap;gap:8px 6px;padding:4px 2px 4px}
.mx .src{flex:0 0 auto;width:74px;text-align:center;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:14px;padding:4px 2px;border:2px solid transparent;transition:transform .12s,box-shadow .12s,opacity .12s,border-color .12s,background .12s}
.mx .src svg{width:58px;height:70px;display:block;margin:0 auto;pointer-events:none}

.mx .dim{opacity:.35}
.mx .armed{border-color:var(--gold)!important;background:#fff8e6!important;animation:mxglow 1s ease-in-out infinite}

.mx .bench{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

.mx .bk{border:2px dashed transparent;border-radius:14px;padding:6px 4px 8px;text-align:center;position:relative;transition:background .15s,border-color .15s}
.mx .bk.sel{border-color:var(--teal2);background:#f1fafc}
.mx .bk .drag{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;border-radius:12px;border:2px solid transparent;transition:transform .12s,box-shadow .12s,opacity .12s}
.mx .bk svg{width:100%;max-width:120px;height:auto;display:block;margin:0 auto;pointer-events:none}
.mx .bk .name{font-weight:900;font-size:15px}
.mx .bk .cont{font-size:11.5px;color:var(--mut);min-height:30px;line-height:1.25;padding:0 2px}
.mx .bk .tag{display:inline-block;font-size:10.5px;font-weight:800;border-radius:999px;padding:1px 8px;margin-top:3px;background:#eef2f4;color:#56707a}
.mx .bk .acts{display:flex;gap:4px;justify-content:center;margin-top:4px}

.mx .tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:560px){.mx .tools{grid-template-columns:repeat(2,1fr)}}
.mx .tool{border:2px solid var(--line);border-radius:14px;padding:8px 6px;text-align:center;background:#fbfdfe;position:relative;transition:background .15s,border-color .15s;cursor:default}

.mx .tool .tn{font-weight:900;font-size:13.5px}

.mx .tool .res{font-size:11px;font-weight:800;color:var(--teal);min-height:14px;margin-top:3px}
.mx .tool.busy{animation:shake .5s ease-in-out 2}
body.dragging .mx .bk:not(.self), body.dragging.withtools .mx .tool{border-color:#c9dbe1;border-style:dashed;animation:mxpulse 1.1s ease-in-out infinite}
@keyframes mxpulse{0%,100%{background:#fbfdfe}50%{background:#f2f9fb}}
.mx .bk.hov,.mx .tool.hov{border-color:var(--gold)!important;border-style:solid!important;background:#fff4d6!important;animation:none!important}
.mx .bk.hov::after,.mx .tool.hov::after{content:'solte aqui';position:absolute;left:50%;top:-11px;transform:translateX(-50%);background:var(--gold);color:#4a3300;font-size:11px;font-weight:900;border-radius:999px;padding:1px 9px;white-space:nowrap}
.mx .opts{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.mx .opt{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:7px 10px;cursor:pointer;font-weight:800;font-size:14px}
.mx .opt input{accent-color:var(--teal)}
.mx .opt.on{border-color:var(--teal2);background:#f1fafc}
.mx .fases{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}

.mx .fb.ok{background:#eaf7ef;border:1px solid #9bd3b2}
.mx .fb.no{background:#fff1ef;border:1px solid #f0b2ab}
.mx .fb.warn{background:#fff8e6;border:1px solid #f1d38a}
.mx .fb ul{margin:6px 0 0;padding-left:18px}
.mx .log{max-height:240px;overflow:auto;font-size:13px;line-height:1.4}

.mx .satrow{border-top:1px solid #edf2f4;padding:8px 0 4px}
.mx .satk{font-weight:900;font-size:14px}

.mx .satbar .lbl{font-size:11px;font-weight:800;color:var(--mut);width:64px}
.mx .cx{width:22px;height:16px;border-radius:4px;border:1.5px solid #9fb6be;display:inline-block}

.hb.warn{border-color:var(--bad);color:var(--bad);background:#fff1ef}
.drow .del.warn{background:var(--bad);color:#fff;white-space:nowrap}

function ciAtom(e,x,y){ const [,c,r]=CI_EL[e]; return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${c}" stroke="rgba(0,0,0,.35)" stroke-width="1"/><circle cx="${(x-r*.35).toFixed(1)}" cy="${(y-r*.35).toFixed(1)}" r="${(r*.3).toFixed(1)}" fill="#fff" opacity=".45"/>`; }
// desenho "sorteado" de forma fixa (seed) para não mudar a cada clique
function ciSbSVG(it, seed, noLegend){
  let out = '';
  if (it.grid){
    for (let r=0;r<5;r++) for (let c=0;c<9;c++){ const e = it.grid.length===1 ? it.grid[0] : it.grid[(r+c)%2]; out += ciAtom(e, 60 + c*30, 40 + r*30); }
  } else {
    const pos = [];
    for (let r=0;r<3;r++) for (let c=0;c<4;c++){ const k = seed*97 + r*4 + c; pos.push([60+c*80+(r%2)*25+(seeded(k)*16-8), 45+r*65+(seeded(k+500)*14-7), seeded(k+900)]); }
    pos.sort((a,b) => a[2]-b[2]);
    pos.slice(0, it.mols.length>1 ? 10 : 8).forEach(([x,y],j)=>{
      const m = CI_MOL[it.mols[j % it.mols.length]];
      const a = seeded(seed*31+j)*Math.PI*2, ca=Math.cos(a), sa=Math.sin(a);
      m.forEach(([e,dx,dy])=>{ if (dx||dy) out += `<line x1="${x}" y1="${y}" x2="${(x+dx*ca-dy*sa).toFixed(1)}" y2="${(y+dx*sa+dy*ca).toFixed(1)}" stroke="#9fb6be" stroke-width="2"/>`; });
      m.forEach(([e,dx,dy])=>{ out += ciAtom(e, x+dx*ca-dy*sa, y+dx*sa+dy*ca); });
    });
  }
  const els = [...new Set(it.grid ? it.grid : it.mols.flatMap(m=>CI_MOL[m].map(a=>a[0])))];
  const svg = `<svg viewBox="0 0 360 200" role="img" aria-label="${esc(it.nome)}" style="max-width:420px;display:block;margin:0 auto">${out}</svg>`;
  return noLegend ? svg : `<div style="width:100%">${svg}<div class="legend mol" style="justify-content:center">${els.map(e=>`<span><i style="background:${CI_EL[e][1]}"></i>${CI_EL[e][0]}</span>`).join('')}</div></div>`;
}

// A chave LSK NÃO pode mudar: é ela que liga a página aos registros já gravados no tablet.
// Publicar uma nova versão do HTML no mesmo endereço mantém esses dados (o localStorage é do endereço, não do arquivo).
const LSK = 'labEstudos_v1';
const LSK_REV = LSK + '__rev';           // marca da última gravação: detecta alterações feitas em outra aba
const LSK_SEG = LSK + '__seguranca';     // cópia de segurança dos dados, feita antes de restaurar um backup
const LSK_RESGATE = LSK + '__resgate';   // conteúdo original guardado quando os dados não puderam ser lidos
const LSK_PIN = LSK + '__pin';           // tentativas de PIN erradas (bloqueio temporário)
const SCHEMA = 2;                        // versão da estrutura dos dados (1 = sem número, antes de 12/11/2026)
const APP_VERSAO = '2026-11-12 · sessão 2';
// att = registro de tentativas (Relatórios e Desempenho): uma entrada por atividade concluída, nunca sobrescrita
function blankDB(){ const k=()=>({joao:{},sofia:{}}); return {done:k(), custom:{joao:[],sofia:[]}, removed:k(), rotina:k(), visto:k(), topics:k(), cards:k(), games:k(), turne:{}, dif:[], att:{joao:[],sofia:[]}}; }
const isObj = x => !!x && typeof x === 'object' && !Array.isArray(x);
// Confere a estrutura de um conjunto de dados (lido do tablet ou de um backup). Devolve a lista de problemas.
function validarDados(d){
  if (!isObj(d)) return ['O conteúdo não é um conjunto de dados da plataforma.'];
  const er = [];
  if (!['done','att','cards','games','custom','rotina'].some(k => k in d)) er.push('O arquivo não tem os dados do Laboratório de Estudos (agenda, tentativas, flashcards ou jogos).');
  ['done','removed','rotina','visto','topics','cards','games','custom','att','turne','camp','disc','prova','treinoTab','mix','famSeen','meta'].forEach(k => { if (k in d && d[k] != null && !isObj(d[k])) er.push(`O campo "${k}" está num formato inválido.`); });
  if ('dif' in d && d.dif != null && !Array.isArray(d.dif)) er.push('O campo "dif" (contas difíceis) está num formato inválido.');
  ['joao','sofia'].forEach(kid => {
    const nm = KIDS[kid].nome;
    if (isObj(d.custom) && d.custom[kid] != null && !Array.isArray(d.custom[kid])) er.push(`As tarefas de ${nm} estão num formato inválido.`);
    if (isObj(d.att) && d.att[kid] != null){
      if (!Array.isArray(d.att[kid])) er.push(`O registro de tentativas de ${nm} está num formato inválido.`);
      else if (d.att[kid].some(a => !isObj(a) || typeof a.ts !== 'number')) er.push(`Há tentativas de ${nm} sem data ou danificadas.`);
    }
  });
  if (d.schema != null && !Number.isInteger(d.schema)) er.push('A versão da estrutura dos dados é inválida.');
  return er;
}
// Migração controlada: só ACRESCENTA o que falta; nunca apaga nem reinicia registros existentes.
function migrateDB(raw, novo){
  if (!isObj(raw)) throw new Error('estrutura inválida');
  const from = Number.isInteger(raw.schema) ? raw.schema : 1;
  if (from > SCHEMA){ const e = new Error('versao-nova'); e.from = from; throw e; }
  const db = Object.assign(blankDB(), raw);
  ['done','removed','rotina','visto','topics','cards','games'].forEach(k => ['joao','sofia'].forEach(kid => { if (db[k][kid] == null) db[k][kid] = {}; }));
  ['joao','sofia'].forEach(kid => { if (db.custom[kid] == null) db.custom[kid] = []; });
  db.att = Object.assign({joao:[], sofia:[]}, db.att || {});
  delete db.att.demo;   // a Demonstração nunca grava; se aparecer, não é registro real
  // 1 → 2: número de versão e metadados (data de criação, histórico de migrações, último backup)
  if (from < 2){
    db.meta = Object.assign({}, isObj(db.meta) ? db.meta : {});
    if (!novo) (db.meta.migracoes = db.meta.migracoes || []).push({de: from, para: 2, em: Date.now()});
  }
  db.meta = isObj(db.meta) ? db.meta : {};
  if (!db.meta.criado) db.meta.criado = db.attSince || Date.now();
  db.schema = SCHEMA;
  return {db, from};
}
// estado do armazenamento: bloqueado = '' | 'indisponivel' | 'corrompido' | 'versao' | 'conflito'
const STORE = {bloqueado:'', falhou:false, erro:'', resgate:null, migrou:0, versaoDados:0};
let DB = blankDB(), REV = null;
(function carregar(){
  let raw = null;
  try { raw = localStorage.getItem(LSK); REV = localStorage.getItem(LSK_REV); }
  catch(e){ STORE.bloqueado = 'indisponivel'; DB = migrateDB({}, true).db; return; }
  if (!raw){ DB = migrateDB({}, true).db; return; }
  let obj;
  try { obj = JSON.parse(raw); if (!isObj(obj)) throw new Error('invalido'); }   // só ilegível conta como dano (a validação rígida fica para os backups)
  catch(e){
    // dados ilegíveis: guarda o conteúdo original e NÃO grava por cima até a professora decidir
    STORE.bloqueado = 'corrompido';
    try {
      const ant = localStorage.getItem(LSK_RESGATE);
      const ja = ant && JSON.parse(ant).raw === raw;
      if (!ja) localStorage.setItem(ant ? LSK_RESGATE + '_' + Date.now() : LSK_RESGATE, JSON.stringify({em: Date.now(), raw}));
      STORE.resgate = true;
    } catch(_){ STORE.resgate = false; }
    STORE.raw = raw;
    DB = migrateDB({}, true).db;
    return;
  }
  try { const r = migrateDB(obj); DB = r.db; STORE.migrou = r.from < SCHEMA ? r.from : 0; }
  catch(e){
    // dados gravados por uma versão MAIS NOVA da plataforma (página desatualizada): só leitura, nunca grava
    STORE.bloqueado = 'versao'; STORE.versaoDados = e.from || 0;
    DB = Object.assign(blankDB(), obj);
  }
})();
if (!DB.attSince) DB.attSince = Date.now();   // a partir de quando o registro detalhado existe
// perfil Demonstração: usa uma cópia vazia, só na memória (REAL_DB guarda os dados reais enquanto isso)
let REAL_DB = null;
let SAVE_ERR_AT = 0;
// Grava os dados. Devolve true só quando a gravação foi confirmada pelo navegador.
function SAVE(){
  if (REAL_DB) return true;   // Demonstração: nada é gravado, de propósito
  if (STORE.bloqueado){ saveFail(); return false; }
  try {
    const atual = localStorage.getItem(LSK_REV);
    if (atual !== REV){ STORE.bloqueado = 'conflito'; saveFail(); return false; }   // outra aba gravou depois: não sobrescreve
    DB.schema = SCHEMA;
    localStorage.setItem(LSK, JSON.stringify(DB));
    const nova = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    try { localStorage.setItem(LSK_REV, nova); REV = nova; } catch(_){}
    if (STORE.falhou){ STORE.falhou = false; STORE.erro = ''; SAVE_ERR_AT = 0; renderStoreBar(); setTimeout(() => toast('Os dados voltaram a ser salvos ✓', true), 50); }
    return true;
  } catch(e){
    STORE.falhou = true; STORE.erro = e && e.name === 'QuotaExceededError' ? 'espaço' : 'erro';
    saveFail(); return false;
  }
}
function storeMsg(){
  const b = STORE.bloqueado;
  if (b === 'conflito') return 'Os dados foram alterados em outra aba. Esta aba parou de salvar para não apagar essas alterações.';
  if (b === 'versao') return 'Esta página está desatualizada em relação aos dados do tablet e não vai salvar nada.';
  if (b === 'corrompido') return 'Os dados salvos não puderam ser lidos. Nada está sendo salvo até a professora resolver.';
  if (b === 'indisponivel') return 'Este navegador não permite salvar dados. Nada do que for feito será guardado.';
  return STORE.erro === 'espaço' ? 'NÃO SALVO: o espaço de armazenamento do navegador está cheio.' : 'NÃO SALVO: o navegador recusou a gravação dos dados.';
}
function saveFail(){ SAVE_ERR_AT = Date.now(); renderStoreBar(); toast('⚠️ ' + storeMsg(), true); }
// faixa de aviso fixa no topo enquanto houver problema de armazenamento
function renderStoreBar(){
  const bar = document.getElementById('storeBar'); if (!bar) return;
  const prob = STORE.bloqueado || STORE.falhou;
  bar.hidden = !prob; if (!prob){ bar.innerHTML = ''; return; }
  const prof = typeof isProf === 'function' && isProf();
  const kid = typeof isKid === 'function' && isKid();
  let acoes = '';
  if (STORE.bloqueado === 'conflito' || STORE.bloqueado === 'versao') acoes = `<button class="btn sm" data-sb="reload">↻ Recarregar esta aba</button>`;
  if (STORE.bloqueado === 'corrompido' && prof) acoes = `<button class="btn sm" data-sb="raw">⬇️ Baixar o conteúdo original</button><button class="btn sm sec" data-sb="restaurar">⬆️ Restaurar um backup</button>${STORE.resgate ? '<button class="btn sm sec" data-sb="zerar">Começar com dados vazios</button>' : ''}`;
  if (STORE.falhou && !STORE.bloqueado && prof) acoes = `<button class="btn sm" data-sb="baixar">⬇️ Baixar backup agora</button>`;
  const extra = STORE.bloqueado === 'corrompido' ? (STORE.resgate ? ' Nada foi apagado: o conteúdo original foi guardado numa cópia de resgate neste tablet.' : ' Nada foi apagado, mas não houve espaço para a cópia de resgate: baixe o conteúdo original antes de qualquer outra ação.')
              : STORE.bloqueado === 'conflito' ? ' Recarregue para continuar com os dados mais recentes (a última ação feita nesta aba não foi salva).'
              : STORE.bloqueado === 'versao' ? ` Recarregue a página para receber a versão nova (dados na estrutura ${STORE.versaoDados}; esta página usa a ${SCHEMA}).`
              : STORE.falhou ? ' O que for feito agora pode se perder.' : '';
  bar.innerHTML = `<b>⚠️ ${storeMsg()}</b><span>${extra}${kid ? ' Avise a professora.' : ''}</span>${acoes ? `<div class="sbact">${acoes}</div>` : ''}`;
  $$('[data-sb]', bar).forEach(b => b.onclick = () => {
    const a = b.dataset.sb;
    if (a === 'reload') location.reload();
    else if (a === 'baixar') baixarBackup();
    else if (a === 'raw') baixarArquivo(STORE.raw || '', `laboratorio-estudos-conteudo-original-${TODAY}.txt`, 'text/plain');

function pinLer(){ try { return JSON.parse(localStorage.getItem(LSK_PIN) || '{}') || {}; } catch(e){ return {}; } }

/* Navegação: cada tela tem um endereço (ex.: "disc-cien/jogos/fq").
   STACK guarda as telas anteriores para o botão Voltar; o botão/gesto "voltar"
   do navegador também funciona (popstate). */
let CUR = 'cronograma', STACK = [], HIST_OK = false;
const parentOf = r => { const p = r.split('/'); return p.length > 1 ? p.slice(0,-1).join('/') : 'cronograma'; };
function go(r, replace){
  r = allowed(r) ? r : 'cronograma';
  if (r !== CUR && !replace){ STACK.push(CUR); if (STACK.length > 60) STACK.shift(); }
  CUR = r;
  try {
    if (location.hash.slice(1) !== CUR) history[replace ? 'replaceState' : 'pushState'](null, '', '#' + CUR);
    HIST_OK = location.hash.slice(1) === CUR;
  } catch(e){ HIST_OK = false; }
  route();
}
function goBack(fallback){
  // com histórico do navegador funcionando, volta por ele (mantém o botão "voltar" do celular em sincronia)
  if (HIST_OK && STACK.length && allowed(STACK[STACK.length-1])){ history.back(); return; }
  let p = STACK.pop();
  while (p && (p === CUR || !allowed(p))) p = STACK.pop();
  CUR = p || (fallback && fallback !== CUR ? fallback : parentOf(CUR));
  try { history.replaceState(null, '', '#' + CUR); } catch(e){}
  route();
}
function onHistoryNav(){
  if (!USER) return;
  const h = location.hash.slice(1) || 'cronograma';
  if (h === CUR) return;
  if (STACK.length && STACK[STACK.length-1] === h) STACK.pop(); else STACK.push(CUR);
  CUR = allowed(h) ? h : 'cronograma';
  route();
}
window.addEventListener('hashchange', onHistoryNav);

function route(keepScroll){
  if (!USER) return;

  $('#topBack').hidden = CUR === 'cronograma' && !STACK.length;

  else if (r === 'relatorios') renderReport(p[1]);

/* =========================================================
   BACKUP: EXPORTAR, CONFERIR E RESTAURAR
   O arquivo leva todos os dados gravados (sem PIN nem senha: os PINs não ficam nos dados).
   A restauração completa é exclusiva da professora, mostra um resumo, pede confirmação
   e guarda antes uma cópia de segurança dos dados atuais (dá para desfazer).
   ========================================================= */
function baixarArquivo(texto, nome, tipo){
  const blob = new Blob([texto], {type: tipo || 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function resumoDB(d){
  const kids = ['joao','sofia'], att = (d.att || {}), n = o => Object.keys(o || {}).length;
  const ult = Math.max(0, ...kids.flatMap(k => (att[k] || []).map(a => a.ts || 0)));
  return {
    tent: Object.fromEntries(kids.map(k => [k, (att[k] || []).length])),
    ult: ult || null,
    agenda: Object.fromEntries(kids.map(k => [k, n((d.done || {})[k])])),
    tarefas: kids.reduce((t, k) => t + ((d.custom || {})[k] || []).length, 0),
    cards: kids.reduce((t, k) => t + n((d.cards || {})[k]), 0),
    turne: n(d.turne),
    partidas: (((d.camp || {}).joao || {}).hist || []).length
  };
}
function baixarBackup(){
  if (!isProf() || REAL_DB){ toast('O backup é feito pela professora.'); return; }
  const agora = new Date();
  DB.meta = DB.meta || {}; const antes = DB.meta.ultimoBackup; DB.meta.ultimoBackup = agora.getTime();
  const pacote = {app:'laboratorio-estudos', tipo:'backup-completo', schema: SCHEMA, versaoApp: APP_VERSAO, exportadoEm: agora.toISOString(), exportadoPor: USER.id === 'mari' ? 'professora' : 'responsáveis', resumo: resumoDB(DB), dados: DB};
  const nome = `laboratorio-estudos-backup-${TODAY}_${pad(agora.getHours())}h${pad(agora.getMinutes())}.json`;
  baixarArquivo(JSON.stringify(pacote, null, 1), nome);
  if (!SAVE()) DB.meta.ultimoBackup = antes;   // o arquivo foi gerado; só a data do "último backup" não pôde ser gravada
  else toast('Backup gerado: ' + nome);
}
// lê e confere um arquivo de backup (formato atual ou o antigo, que era o próprio conjunto de dados)
function lerBackup(texto){
  let o;
  try { o = JSON.parse(texto); } catch(e){ return {erros:['O arquivo não é um backup válido: o conteúdo está incompleto ou danificado.']}; }
  let dados, info = {exportadoEm:null, versaoApp:null, formato:'atual', por:null};
  if (isObj(o) && 'app' in o){
    if (o.app !== 'laboratorio-estudos') return {erros:['Este arquivo é de outro programa, não do Laboratório de Estudos.']};
    dados = o.dados; info.exportadoEm = o.exportadoEm || null; info.versaoApp = o.versaoApp || null; info.por = o.exportadoPor || null; info.tipo = o.tipo;
    if (Number.isInteger(o.schema) && o.schema > SCHEMA) return {erros:[`Este backup foi feito por uma versão mais nova da plataforma (estrutura ${o.schema}; esta página usa a ${SCHEMA}). Atualize a página antes de restaurar.`]};
  } else if (isObj(o) && 'done' in o){ dados = o; info.formato = 'antigo'; }
  else return {erros:['O arquivo não tem os dados do Laboratório de Estudos.']};
  const er = validarDados(dados);
  if (er.length) return {erros: er};
  let m;
  try { m = migrateDB(JSON.parse(JSON.stringify(dados))); }
  catch(e){ return {erros:[e.message === 'versao-nova' ? `Este backup foi feito por uma versão mais nova da plataforma (estrutura ${e.from}; esta página usa a ${SCHEMA}). Atualize a página antes de restaurar.` : 'A estrutura do arquivo é incompatível com a plataforma.']}; }
  info.schemaArq = m.from;
  return {ok:true, dados: m.db, info};
}

// substitui os dados: devolve true ou o motivo da recusa (os dados atuais continuam como estavam)
function aplicarRestauracao(novo, baixou){
  if (!isProf() || REAL_DB) return 'Só a professora pode restaurar backups.';
  if (STORE.bloqueado === 'versao' || STORE.bloqueado === 'indisponivel' || STORE.bloqueado === 'conflito') return '⛔ A restauração não foi feita: ' + storeMsg() + ' Nada foi alterado.';
  let seg = false;
  try { localStorage.setItem(LSK_SEG, JSON.stringify({em: Date.now(), dados: DB})); seg = true; } catch(e){}
  if (!seg && !baixou) return '⛔ Não houve espaço para guardar a cópia de segurança no tablet. Toque em "Baixar também uma cópia dos dados atuais" e depois confirme de novo. Nada foi alterado.';
  const anterior = DB, bloq = STORE.bloqueado;
  DB = novo;
  if (bloq === 'corrompido'){ STORE.bloqueado = ''; try { REV = localStorage.getItem(LSK_REV); } catch(e){} }

  return true;
}

const DS = {};   // aba atual por disciplina
const FC = {};   // estado dos flashcards (chave: usuário|disciplina)
let GM = null;   // jogo em tela
let GMS = {};    // jogos pausados (chave: usuário|disciplina|jogo) — retomados ao voltar
const PLAYK = 'labEstudos_play';
try { const p = JSON.parse(sessionStorage.getItem(PLAYK) || '{}'); GMS = p.g || {}; Object.assign(FC, p.f || {}); } catch(e){}
function savePlay(){
  const g = {};
  Object.keys(GMS).forEach(k => { const v = GMS[k]; if (v && !v.end){ const c = Object.assign({}, v); delete c.g; g[k] = c; } });
  try { sessionStorage.setItem(PLAYK, JSON.stringify({g, f:FC})); } catch(e){}
}
const gmKey = (s, gid) => `${USER.id}|${s}|${gid}`;
function newGame(s, g){ return {subj:s, gid:g.id, order: shuffle(g.items.map((_,i)=>i)), i:0, tries:0, score:0, resolved:false, sel:null, picked:[], end:false}; }
function renderDisc(s, tabArg, gid){
  const S = SUBJ[s];
  $('#pgTitle').textContent = `${S.ic} ${S.nome}`;
  const tab = tabArg || DS[s] || 'conteudo';
  DS[s] = tab;
  // mesma ordem de abas em todas as matérias; extras da matéria vêm depois
  const tabs = [['conteudo','📋 O que cai na prova'],['flash','🃏 Flashcards'],['jogos','🎯 Jogos'],['disc','✍️ Discursivas'],['prova','⏱️ Prova relâmpago'],['glossario','📖 Glossário']];
  if (s === 'mat') tabs.push(['tabela','📏 Tabela de conversão']);
  // tabuada: cada perfil vê a sua atividade (professora e responsáveis veem as duas) + treino aleatório para todos
  if (s === 'mat' && (!isKid() || USER.kid === 'joao')) tabs.push(['camp','🏆 Campeonato da Tabuada']);
  if (s === 'mat' && (!isKid() || USER.kid === 'sofia')) tabs.push(['turne','✦ Turnê da Tabuada']);
  if (s === 'mat') tabs.push(['treino','🎲 Treino Aleatório']);
  if ((tab === 'camp' && !tabs.some(t => t[0] === 'camp')) || (tab === 'turne' && !tabs.some(t => t[0] === 'turne'))) return go(`disc-${s}/treino`, true);
  const th = THEME();
  $('#view').innerHTML = `<div class="disc ${th.cls}" style="--sc:${S.cor}">
    <div class="dhead" style="background:${S.cor}"><div class="ic">${S.ic}</div><div style="min-width:0;flex:1"><h2>${S.nome}</h2><div class="sub">Prova: ${TOPICS[s].prova} · 5 discursivas + 5 objetivas</div></div>
      ${th.chip ? `<div class="kidchip">${th.chip}</div>` : ''}</div>
    <nav class="tabs dtabs">${tabs.map(t => `<button class="tab ${tab===t[0]?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('')}</nav>
    ${isResp() ? `<div class="chips" id="verKid" style="align-items:center"><span class="hint" style="font-weight:800">Acompanhando:</span>${(RESP_LINK[USER.id] || []).map(k => `<button class="chip ${verKids()[0] === k ? 'on' : ''}" data-vk="${k}">${KIDS[k].ic} ${KIDS[k].nome}</button>`).join('')}</div>` : ''}
    <div id="dBody"></div></div>`;
  $$('#view .dtabs .tab').forEach(b => b.onclick = () => go(`disc-${s}/${b.dataset.t}`));
  $$('#verKid [data-vk]').forEach(b => b.onclick = () => { VER_KID = b.dataset.vk; route(true); });
  const body = $('#dBody');
  GM = null;
  if (tab === 'conteudo') renderTopics(s, body);
  else if (tab === 'flash') renderFlash(s, body, gid);
  else if (tab === 'jogos') {
    const g = gid && GAMES[s].find(x => x.id === gid);
    if (!g) renderGameList(s, body);
    else if (g.kind === 'maps') renderMaps(s, body);
    else if (g.kind === 'texto') renderTexto(s, body);
    else if (g.kind === 'link') renderGameList(s, body);
    else if (CIK[g.kind]) {
      const k = gmKey(s, g.id);
      let st = GMS[k];
      if (!st || st.end || st.kind !== g.kind) st = GMS[k] = CIK[g.kind].create(g);
      CIK[g.kind].render(s, g, st, body);
    }
    else {
      const k = gmKey(s, g.id);
      if (!GMS[k] || GMS[k].end) GMS[k] = newGame(s, g);
      GM = GMS[k]; GM.g = g; GM.subj = s;
      renderGame(body);
    }
  }
  else if (tab === 'glossario') renderGlossario(s, body);
  else if (tab === 'disc') renderDiscursivas(s, body);
  else if (tab === 'prova') renderProva(s, body);
  else if (tab === 'tabela') renderTabela(body);
  else if (tab === 'turne') renderTurne(body);
  else if (tab === 'camp') renderCamp(body);
  else if (tab === 'treino') renderTreinoTab(body);
}

/* ---- glossário (mesmo formato do glossário do Laboratório de Misturas: busca + termo, definição e exemplo) ---- */
const GLF = {};   // filtro de capítulo por matéria
const normTxt = t => String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function renderGlossario(s, body){
  const list = GLOSS[s] || [];
  const caps = [...new Set(list.map(g => g[3]))];
  const f = GLF[s] = GLF[s] || {cap:'', q:''};
  body.innerHTML = `<section class="card vcard">${qhead('📖 Glossário', `As palavras-chave de ${SUBJ[s].nome}, cada uma com uma frase e um exemplo.`, `<span class="score" id="glN"></span>`)}
    <input type="search" class="busca" id="glBusca" placeholder="Procurar palavra… (ex.: ${esc(list[0] ? list[0][0].split(' ')[0].toLowerCase() : '')})" value="${esc(f.q)}">
    <div class="chips" id="glCaps">${[''].concat(caps).map(c => `<button class="chip ${f.cap===c?'on':''}" data-c="${esc(c)}">${c || 'Todos'}</button>`).join('')}</div>
    <div class="gl" id="glLista"></div></section>`;
  const draw = () => {
    const t = normTxt(f.q.trim());
    const it = list.filter(g => (!f.cap || g[3] === f.cap) && (!t || normTxt(g.join(' ')).includes(t)));
    $('#glN').textContent = `${it.length} termo${it.length===1?'':'s'}`;
    $('#glLista').innerHTML = it.length ? it.map(g => `<div><b>${esc(g[0])}</b><span class="tagx">${esc(g[3])}</span><br>${esc(g[1])}<br><i>Ex.: ${esc(g[2])}</i></div>`).join('') : '<div class="hint">Nenhuma palavra encontrada.</div>';
  };
  $('#glBusca').oninput = e => { f.q = e.target.value; draw(); };
  $$('#glCaps .chip').forEach(b => b.onclick = () => { f.cap = b.dataset.c; $$('#glCaps .chip').forEach(x => x.classList.toggle('on', x === b)); draw(); });
  draw();
}

const KW_CACHE = new Map();
const KW_ROTULO_EXTRA = {adic:'adição'};   // radicais que não aparecem por extenso em nenhum texto da matéria
const kwNorm = t => normTxt(t).replace(/³/g, '3').replace(/²/g, '2');
function kwRotulos(s, it){
  if (KW_CACHE.has(it)) return KW_CACHE.get(it);
  const corpus = [it.model.replace(/<[^>]+>/g, ' '), it.q].concat(it.check, it.parts, (CARDS[s] || []).flat(), (GLOSS[s] || []).flat()).join(' \n ');
  const words = corpus.split(/\s+/).map(w => w.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}³²]+$/gu, '')).filter(Boolean);
  const nw = words.map(kwNorm);
  const acha = p => { for (let i = 0; i < nw.length; i++){ if (p.length < 3 ? nw[i] === p : nw[i].startsWith(p)) return i; } return -1; };
  const map = {};
  it.kw.forEach(k => {
    const parts = kwNorm(k).trim().split(/\s+/);
    let lab = null;
    for (let i = 0; i < nw.length && !lab; i++){   // expressão inteira em sequência
      if (!(parts[0].length < 3 ? nw[i] === parts[0] : nw[i].startsWith(parts[0]))) continue;
      if (parts.every((p, j) => j === 0 || (nw[i + j] || '').startsWith(p))) lab = words.slice(i, i + parts.length).join(' ');
    }
    if (!lab) lab = parts.map(p => { const i = acha(p); return i >= 0 ? words[i] : (KW_ROTULO_EXTRA[p] || p); }).join(' ');   // palavra por palavra
    map[k] = lab;
  });
  KW_CACHE.set(it, map); return map;
}
function kwTexto(s, it, txt){
  const m = kwRotulos(s, it), f = [...new Set(it.kw.filter(k => normTxt(txt).includes(k)).map(k => m[k]))];
  return `Palavras importantes que já aparecem: ${f.length ? f.join(', ') : 'nenhuma ainda'}`;
}

const PRS = {};   // prova em andamento por usuário|matéria
let prTimer = null;
function renderProva(s, body){
  const P = PROVA_GEN[s];
  if (!P){ body.innerHTML = soonHTML(s, 'prova'); return; }
  const kid = isKid() ? USER.kid : null, th = THEME(), key = USER.id + '|' + s;
  const pr = PRS[key];
  const hist = kid ? ((((DB.prova = DB.prova || {})[kid] = DB.prova[kid] || {})[s]) || []) : [];
  clearInterval(prTimer);
  if (!pr){
    const adm = !kid ? verKids().map(k => { const h = (((DB.prova || {})[k] || {})[s] || []).slice(-3); return `<div><b>${KIDS[k].ic} ${KIDS[k].nome}:</b> ${h.length ? h.map(p => `${p.d}: ${p.n.toFixed(1).replace('.',',')}`).join(' · ') : '<span class="hint">nenhuma prova ainda</span>'}</div>`; }).join('') : '';
    body.innerHTML = `<section class="card vcard">${qhead('⏱️ Prova relâmpago', 'Questões objetivas sorteadas. Leia tudo, escolha e confira só no fim, como na prova.')}
      <div class="rule">${P.rule}</div>
      <label style="display:flex;gap:8px;align-items:center;font-weight:800;margin:8px 0"><input type="checkbox" id="prTempo"> Com tempo (10 minutos)</label>
      <button class="btn" id="prGo" style="background:var(--sc)">Começar a prova</button>
      ${hist.length ? `<p class="hint" style="margin-top:10px">Últimas notas: ${hist.slice(-3).map(p => `${p.d}: ${p.n.toFixed(1).replace('.',',')}`).join(' · ')}</p>` : ''}
      ${adm ? `<div class="kidans">${adm}</div>` : ''}</section>`;
    $('#prGo').onclick = () => { PRS[key] = {qs: P.gen(), ans:{}, fim:false, t0: Date.now(), tempo: $('#prTempo').checked}; renderProva(s, body); };
    return;
  }
  const finish = () => {
    clearInterval(prTimer);
    if (pr.fim) return;
    pr.fim = true; pr.ok = pr.qs.filter((q,i) => pr.ans[i] === q.c).length; pr.nota = pr.ok * 10 / pr.qs.length;
    if (kid){ const d = new Date(); ((DB.prova[kid])[s] = (DB.prova[kid][s] || [])).push({d:`${d.getDate()}/${d.getMonth()+1}`, n: pr.nota, ts: Date.now()}); SAVE(); }
    logAttempt(pr, {act: 'prova-' + s, s, n: pr.qs.length, ok: pr.ok});
    renderProva(s, body); window.scrollTo(0, Math.max(0, body.getBoundingClientRect().top + scrollY - 70));
  };
  const restante = () => 600 - Math.floor((Date.now() - pr.t0) / 1000);
  if (!pr.fim && pr.tempo && restante() <= 0) return finish();
  const N = pr.qs.length;
  body.innerHTML = `<section class="card vcard">
    ${qhead('⏱️ Prova relâmpago', pr.fim ? 'Correção: veja a resposta certa de cada questão.' : `Responda as ${N} questões e entregue no fim.`, `<span class="score" id="prTimerTxt">${pr.fim ? `${th.pt(pr.ok)}` : `${Object.keys(pr.ans).length}/${N} respondidas`}</span>`)}
    ${pr.qs.map((q,i) => `<div class="prq"><div class="t">${i+1}. ${esc(q.t)}</div>${q.op.map((o,j) => {
      let c = pr.ans[i] === j ? 'on' : '';
      if (pr.fim){ if (j === q.c) c = 'good'; else if (pr.ans[i] === j) c = 'badc'; }
      return `<div class="op ${c}" data-pq="${i}" data-po="${j}">${String.fromCharCode(65+j)}) ${esc(o)}</div>`; }).join('')}
      ${pr.fim ? `<div class="ex">${pr.ans[i] === q.c ? '✓ Certa.' : '✗'} ${esc(q.ex)}</div>` : ''}</div>`).join('')}
    ${pr.fim ? `<div class="fbk ok" style="text-align:center;margin-top:12px"><div class="nota">${pr.nota.toFixed(1).replace('.',',')}</div>Você acertou <b>${pr.ok} de ${N}</b> · ${th.pt(pr.ok)}. Veja acima a correção de cada questão.<div class="gbtns" style="justify-content:center"><button class="btn" id="prAgain" style="background:var(--sc)">Fazer outra prova</button></div></div>`
      : `<div class="gbtns"><button class="btn" id="prEnd" style="background:var(--sc)">Entregar a prova</button><span class="hint" id="prFalta" style="align-self:center"></span></div>`}
  </section>`;
  $$('[data-pq]', body).forEach(o => o.onclick = () => { if (pr.fim) return; pr.ans[o.dataset.pq] = +o.dataset.po; pr.confirm = false; renderProva(s, body); });
  if ($('#prEnd')) $('#prEnd').onclick = () => {
    const falta = N - Object.keys(pr.ans).length;
    if (falta && !pr.confirm){ pr.confirm = true; $('#prFalta').textContent = `Faltam ${falta} questões. Toque de novo em "Entregar" para entregar assim mesmo.`; return; }
    finish();
  };
  if ($('#prAgain')) $('#prAgain').onclick = () => { delete PRS[key]; renderProva(s, body); };
  if (!pr.fim && pr.tempo){
    const upd = () => {
      const el = $('#prTimerTxt'); if (!el){ clearInterval(prTimer); return; }   // saiu da tela: o tempo continua contando pelo relógio
      const r = restante(); if (r <= 0) return finish();
      el.textContent = `⏱️ ${Math.floor(r/60)}:${String(r%60).padStart(2,'0')} · ${Object.keys(pr.ans).length}/${N}`;
    };
    upd(); prTimer = setInterval(upd, 500);
  }
}

/* ---- padrão visual (mesma estrutura do Laboratório de Misturas) ---- */
// cabeçalho de seção: título + subtítulo à esquerda, placar/botões à direita
function qhead(title, sub, right, tag){
  return `<div class="qhead"><div style="min-width:0"><h2 class="vh">${title}${tag ? `<span class="tagx">${esc(tag)}</span>` : ''}</h2>${sub ? `<p class="vsub">${sub}</p>` : ''}</div>${right ? `<div class="qtools">${right}</div>` : ''}</div>`;
}
// personalização: João = futebol, Sofia = pop; responsáveis/professora = tema geral
function THEME(){
  const k = isKid() ? USER.kid : null;
  if (k === 'joao') return {cls:'th-joao', chip:'⚽ Modo campeonato', pt:n => `⚽ ${n} gol${n===1?'':'s'}`, ok:'⚽ Golaço!', ok2:'Gol no rebote!', fim:'Fim de jogo!', ico:'⚽'};
  if (k === 'sofia') return {cls:'th-sofia', chip:'✦ Modo comeback', pt:n => `✦ ${n} estrela${n===1?'':'s'}`, ok:'✦ Arrasou!', ok2:'Acertou no bis!', fim:'Fim do show!', ico:'✦'};
  return {cls:'', chip:'', pt:n => `${n} ponto${n===1?'':'s'}`, ok:'✓ Isso!', ok2:'Agora sim!', fim:'Fim do jogo!', ico:'⭐'};
}

/* ---- conteúdos ---- */
function renderTopics(s, body){
  const T = TOPICS[s];
  const kid = isKid() ? USER.kid : null;
  const tp = k => (DB.topics[k] = DB.topics[k] || {});
  let n = 0, rev = 0, sei = 0;
  const html = T.caps.map((c, ci) => `<div class="chap"><h3>${esc(c[0])}</h3>${c[1].map((t, ti) => {
    const key = `${s}|${ci}|${ti}`; n++;
    if (kid){
      const v = tp(kid)[key] || [];
      if (v[0]) rev++; if (v[1]) sei++;
      return `<div class="trow"><span class="cks"><input type="checkbox" data-k="${key}" data-i="0" ${v[0]?'checked':''} title="Revisei"><input type="checkbox" data-k="${key}" data-i="1" ${v[1]?'checked':''} title="Sei explicar sozinho(a)"></span><span>${esc(t)}</span></div>`;
    }
    const lab = k => { const v = tp(k)[key] || []; return `<span class="${v[1]?'s':v[0]?'r':''}">${KIDS[k].nome}: ${v[1]?'sei explicar':v[0]?'revisou':'—'}</span>`; };
    return `<div class="trow"><span style="flex:1">${esc(t)}</span><span class="who2">${verKids().map(lab).join('')}</span></div>`;
  }).join('')}</div>`).join('');
  const head = kid ? `<div class="rule">1º quadradinho: <b>revisei</b> • 2º: <b>sei explicar ${kid==='sofia'?'sozinha':'sozinho'}</b>. Marque o 2º só quando conseguir explicar sem olhar.</div>
      <div class="prog"><i style="width:${n?Math.round(sei/n*100):0}%"></i></div>` :
      `<div class="rule">Como cada um marcou os conteúdos (a marcação é feita por eles).</div>`;
  body.innerHTML = `<section class="card vcard">${qhead('📋 O que cai na prova', `Prova: ${TOPICS[s].prova} · conteúdos da agenda "Minhas provas".`, kid ? `<span class="score">${sei}/${n} sei explicar</span>` : '')}${head}${html}</section>
    ${kid ? `<div class="tip ${KIDS[kid].sigla}">${NA_PROVA[kid]}</div>` : ''}`;
  $$('input[data-k]', body).forEach(i => i.onchange = () => {
    const v = tp(kid)[i.dataset.k] = tp(kid)[i.dataset.k] || [false,false];
    v[+i.dataset.i] = i.checked; SAVE(); renderTopics(s, body);
  });
}

// todos os cards de Matemática, cada um uma única vez
function matAll(){
  const m = {};
  CARDS.mat.forEach(c => m[c[0]] = {id:c[0], q:c[1], a:c[2], p:c[3], ex:c[4], ill: MAT_KIT_ILL[c[0]], src:'Kit · flashcards'});
  const st = STAR.mat; m[st[0]] = {id:st[0], q:st[1], a:st[2], p:st[3], ex:st[4], ill: MAT_KIT_ILL[st[0]], src:'Kit · card ★', star:true};
  MAT_EXTRA.forEach(c => m[c[0]] = {id:c[0], q:c[1], a:c[2], p:c[3], ex:c[4], ill:c[5], src:c[6]});
  return m;
}
function matDeck(cat){
  const m = matAll(), showStar = !isKid() || USER.kid === 'sofia';
  const ids = cat === 'geral' ? MAT_CATS.flatMap(c => c.ids) : ((MAT_CATS.find(c => c.id === cat) || {}).ids || []);
  return [...new Set(ids)].map(id => m[id]).filter(c => c && (!c.star || showStar)).map(c => Object.assign({cat: MAT_CATS.find(k => k.ids.includes(c.id))}, c));
}

/* ---- ilustrações dos cards de Matemática (SVG desenhado no próprio arquivo) ---- */
const MI = (() => {
  const INK = '#1f4f5c', F = '#e6f2f5', T = '#fdf0d0', R = '#cfe3ea';
  const txt = (x, y, t, o = {}) => `<text x="${x}" y="${y}" text-anchor="${o.a||'middle'}" font-size="${o.fs||12}" font-weight="${o.fw||800}" fill="${o.c||INK}" font-family="Nunito,sans-serif">${t}</text>`;
  // paralelepípedo em perspectiva (frente + topo + lateral), quadriculado em cubinhos
  function boxG(ox, oy, l, w, h, s, opt = {}){
    const k = 0.5, dx = w*s*k, dy = -w*s*k, grid = opt.grid !== false;
    let g = '';
    const P = (x, y) => `${(ox+x).toFixed(1)},${(oy+y).toFixed(1)}`;
    // topo
    g += `<polygon points="${P(0,0)} ${P(l*s,0)} ${P(l*s+dx,dy)} ${P(dx,dy)}" fill="${opt.top||T}" stroke="${INK}" stroke-width="1.6"/>`;
    // lateral
    g += `<polygon points="${P(l*s,0)} ${P(l*s+dx,dy)} ${P(l*s+dx,dy+h*s)} ${P(l*s,h*s)}" fill="${opt.side||R}" stroke="${INK}" stroke-width="1.6"/>`;
    // frente
    g += `<rect x="${ox}" y="${oy}" width="${l*s}" height="${h*s}" fill="${opt.front||F}" stroke="${INK}" stroke-width="1.6"/>`;
    if (grid){
      for (let i=1;i<l;i++) g += `<line x1="${ox+i*s}" y1="${oy}" x2="${ox+i*s}" y2="${oy+h*s}" stroke="${INK}" stroke-width=".8"/><line x1="${ox+i*s}" y1="${oy}" x2="${ox+i*s+dx}" y2="${oy+dy}" stroke="${INK}" stroke-width=".8"/>`;
      for (let j=1;j<h;j++) g += `<line x1="${ox}" y1="${oy+j*s}" x2="${ox+l*s}" y2="${oy+j*s}" stroke="${INK}" stroke-width=".8"/><line x1="${ox+l*s}" y1="${oy+j*s}" x2="${ox+l*s+dx}" y2="${oy+j*s+dy}" stroke="${INK}" stroke-width=".8"/>`;
      for (let d=1; d<w; d++){ const ddx = d*s*k, ddy = -d*s*k;
        g += `<line x1="${ox+ddx}" y1="${oy+ddy}" x2="${ox+l*s+ddx}" y2="${oy+ddy}" stroke="${INK}" stroke-width=".8"/><line x1="${ox+l*s+ddx}" y1="${oy+ddy}" x2="${ox+l*s+ddx}" y2="${oy+ddy+h*s}" stroke="${INK}" stroke-width=".8"/>`; }
    }
    if (opt.labels){
      const [la, wa, ha] = opt.labels;
      g += txt(ox + l*s/2, oy + h*s + 15, la) + txt(ox - 6, oy + h*s/2 + 4, ha, {a:'end'}) + txt(ox + l*s + dx/2 + 8, oy + h*s + dy/2 + 10, wa, {a:'start'});
    }
    return {g, w: l*s + dx, h: h*s - dy};
  }
  function box(l, w, h, labels){
    const s = Math.min(150/(l + w*0.5), 84/(h + w*0.5), 30);
    const b = boxG(0, 0, l, w, h, s, {labels: labels === false ? null : [`${l} cm`, `${w} cm`, `${h} cm`]});
    const ox = (240 - b.w)/2, oy = (130 - b.h)/2 - (h*s - b.h);   // centraliza
    return svg(`<g transform="translate(${ox.toFixed(1)},${(oy + 2).toFixed(1)})">${b.g}</g>`);
  }
  const svg = inner => `<svg viewBox="0 0 240 130" role="img">${inner}</svg>`;
  const die = (x, y, n, sz = 34, hi) => {
    const p = {1:[[.5,.5]],2:[[.25,.25],[.75,.75]],3:[[.25,.25],[.5,.5],[.75,.75]],4:[[.25,.25],[.75,.25],[.25,.75],[.75,.75]],5:[[.25,.25],[.75,.25],[.5,.5],[.25,.75],[.75,.75]],6:[[.25,.22],[.75,.22],[.25,.5],[.75,.5],[.25,.78],[.75,.78]]}[n];
    return `<rect x="${x}" y="${y}" width="${sz}" height="${sz}" rx="6" fill="${hi ? '#fff4d6' : '#fff'}" stroke="${hi ? '#f0b33e' : INK}" stroke-width="${hi ? 3 : 1.8}"/>` + p.map(([a,b]) => `<circle cx="${x+a*sz}" cy="${y+b*sz}" r="${sz*.08}" fill="${INK}"/>`).join('');
  };
  const bag = () => `<path d="M85 22 h70 l-6 10 q22 18 18 60 q-2 26 -47 26 q-45 0 -47 -26 q-4 -42 18 -60z" fill="#f3f8fa" stroke="${INK}" stroke-width="2"/>` +
    [[100,62,'#e2574c'],[122,56,'#e2574c'],[144,64,'#e2574c'],[108,86,'#4a7fd6'],[132,88,'#4a7fd6'],[120,106,'#f0c33e']].map(([x,y,c]) => `<circle cx="${x}" cy="${y}" r="10" fill="${c}" stroke="rgba(0,0,0,.3)"/>`).join('');
  const bars = axes => {
    const d = [['Futebol',8],['Vôlei',5],['Basquete',3],['Natação',4]];
    let g = `<line x1="40" y1="108" x2="228" y2="108" stroke="${INK}" stroke-width="2"/><line x1="40" y1="108" x2="40" y2="12" stroke="${INK}" stroke-width="2"/>`;
    for (let v = 0; v <= 8; v += 2) g += `<line x1="37" y1="${108 - v*11}" x2="228" y2="${108 - v*11}" stroke="#dde7ea" stroke-width="1"/>` + txt(32, 112 - v*11, v, {a:'end', fs:10});
    d.forEach(([n, v], i) => { const x = 52 + i*45; g += `<rect x="${x}" y="${108 - v*11}" width="30" height="${v*11}" fill="${['#2f6fd6','#2e9e6b','#f0a23e','#b8405a'][i]}" rx="3"/>` + txt(x + 15, 104 - v*11, v, {fs:11}) + txt(x + 15, 122, n, {fs:9.5}); });
    if (axes) g += txt(8, 60, 'eixo', {fs:10, c:'#d0544b'}) + `<path d="M14 64 l20 30" stroke="#d0544b" stroke-width="1.5"/>` + `<rect x="150" y="14" width="76" height="22" rx="5" fill="#fff" stroke="#d0544b"/>` + txt(188, 29, 'legenda', {fs:10, c:'#d0544b'});
    return svg(g);
  };
  const ladder = (units, step, hi) => {
    const w = 220 / units.length; let g = '';
    units.forEach((u, i) => { g += `<rect x="${10 + i*w}" y="34" width="${w - 3}" height="34" rx="5" fill="${i === hi ? '#f0b33e' : '#2e6f80'}"/>` + txt(10 + i*w + (w-3)/2, 56, u, {c: i === hi ? '#3d2a00' : '#fff', fs: units.length > 4 ? 12 : 15}); });
    g += `<path d="M20 86 h196" stroke="#2e9e6b" stroke-width="2.5" marker-end="url(#ar)"/>` + txt(120, 102, `descer: × ${step}`, {c:'#1f7a50'}) + `<path d="M216 116 h-196" stroke="#d0544b" stroke-width="2.5" marker-end="url(#ar2)"/>` + txt(120, 22, `subir: ÷ ${step}`, {c:'#b03a32'});
    return svg(`<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#2e9e6b"/></marker><marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#d0544b"/></marker></defs>` + g);
  };
  const bottle = (x, label, sc = 1) => `<g transform="translate(${x},0) scale(${sc})"><rect x="22" y="8" width="16" height="10" rx="2" fill="#2f6fd6"/><path d="M22 18 h16 v10 q14 8 14 22 v56 q0 8 -8 8 h-28 q-8 0 -8 -8 v-56 q0 -14 14 -22z" fill="#d9f0fb" stroke="#6fa6bb" stroke-width="2"/><rect x="8" y="62" width="44" height="22" fill="#fff" stroke="#6fa6bb"/>${txt(30, 78, label, {fs:12})}</g>`;
  const table = rows => { let g = `<rect x="40" y="10" width="160" height="${(rows.length+1)*24}" rx="6" fill="#fff" stroke="${INK}" stroke-width="1.5"/>`;
    g += `<rect x="40" y="10" width="160" height="24" rx="6" fill="${INK}"/>` + txt(80, 27, rows[0][0], {c:'#fff', fs:11}) + txt(160, 27, rows[0][1], {c:'#fff', fs:11});
    rows.slice(1).forEach((r, i) => { const y = 34 + i*24; g += `<line x1="40" y1="${y}" x2="200" y2="${y}" stroke="#dde7ea"/>` + (r[2] ? `<circle cx="56" cy="${y+12}" r="6" fill="${r[2]}"/>` : '') + txt(84, y + 16, r[0], {fs:12}) + txt(160, y + 16, r[1], {fs:12}); });
    return svg(g); };
  const DRAW = {
    'cube-edges': () => { const b = boxG(80, 44, 1, 1, 1, 64, {grid:false}); return svg(b.g.replace(/stroke="#1f4f5c" stroke-width="1.6"/g, 'stroke="#d0544b" stroke-width="3.2"') + txt(196, 64, '12', {fs:20, c:'#d0544b', fw:900}) + txt(196, 80, 'arestas', {fs:11, c:'#d0544b'})); },
    'cube-faces': () => { const b = boxG(80, 44, 1, 1, 1, 64, {grid:false, front:'#bfe3f7', top:'#ffe2bd', side:'#c9ecd6'}); return svg(b.g + txt(196, 64, '6', {fs:22, c:INK, fw:900}) + txt(196, 80, 'faces', {fs:11})); },
    unitcube: () => { const b = boxG(92, 50, 1, 1, 1, 52, {grid:false, labels:['1 cm','1 cm','1 cm']}); return svg(b.g + txt(200, 40, '1 cm³', {fs:16, fw:900, c:'#2f6fd6'})); },
    litro: () => { const b = boxG(14, 46, 1, 1, 1, 58, {grid:false, labels:['10 cm','10 cm','10 cm']}); return svg(b.g + txt(122, 76, '=', {fs:30, fw:900}) + bottle(150, '1 L', .95)); },
    boxes2: () => { const a = boxG(22, 54, 3, 2, 2, 17, {labels:['3','2','2']}), b2 = boxG(140, 40, 4, 1, 3, 17, {labels:['4','1','3']}); return svg(a.g + b2.g + txt(52, 22, 'A', {fs:15, fw:900}) + txt(176, 22, 'B', {fs:15, fw:900})); },
    dims: () => svg(`<line x1="16" y1="70" x2="66" y2="70" stroke="#2e6f80" stroke-width="5" stroke-linecap="round"/>` + txt(41, 104, '× 10', {fs:13}) + txt(41, 120, '1 dimensão', {fs:9}) +
      `<rect x="92" y="46" width="48" height="48" fill="#cfe9d9" stroke="#3c7f5a" stroke-width="2"/>` + txt(116, 110, '× 100', {fs:13}) + txt(116, 124, '2 dimensões', {fs:9}) +
      boxG(170, 54, 1, 1, 1, 38, {grid:false, front:'#e3dcf3', top:'#efeaf9', side:'#d2c7ec'}).g + txt(200, 112, '× 1 000', {fs:13}) + txt(200, 126, '3 dimensões', {fs:9})),
    die: () => svg(die(100, 38, 5, 50)),
    'die-even': () => svg([1,2,3,4,5,6].map((n, i) => die(10 + i*38, 46, n, 32, n % 2 === 0)).join('') + txt(120, 108, 'par: {2, 4, 6}', {fs:13})),
    'die-gt4': () => svg([1,2,3,4,5,6].map((n, i) => die(10 + i*38, 46, n, 32, n > 4)).join('') + txt(120, 108, 'maior que 4: {5, 6}', {fs:13})),
    coin: () => svg(`<circle cx="80" cy="64" r="40" fill="#f6d36b" stroke="#b8901f" stroke-width="3"/>${txt(80, 70, 'CARA', {fs:14, c:'#7a5a00'})}<circle cx="164" cy="64" r="40" fill="#e9c24f" stroke="#b8901f" stroke-width="3"/>${txt(164, 70, 'COROA', {fs:13, c:'#7a5a00'})}`),
    tally: () => table([['Resultado','Vezes'],['Cara','9'],['Coroa','11'],['Total','20']]),
    table: () => table([['Cor','Vezes'],['Vermelha','6','#e2574c'],['Azul','3','#4a7fd6'],['Amarela','1','#f0c33e']]),
    bag: () => svg(bag()),
    bars: () => bars(false),
    axes: () => bars(true),
    ladder: () => ladder(['km','hm','dam','m','dm','cm','mm'], 10, 3),
    ladder3: () => ladder(['m³','dm³','cm³'], '1 000', 1)
  };
  return function(code){
    if (!code) return '';
    if (code.startsWith('box:')){ const [l,w,h] = code.slice(4).split(',').map(Number); return box(l, w, h); }
    if (code.startsWith('cube:')){ const n = +code.slice(5); return box(n, n, n); }
    if (code.startsWith('bottle:')) return svg(bottle(90, code.slice(7)));
    return DRAW[code] ? DRAW[code]() : '';
  };
})();

function fcDeck(s, cat){
  const CF = FC_CFG[s], m = CF.all(), showStar = !isKid() || USER.kid === 'sofia';
  const ids = cat === 'geral' ? CF.cats.flatMap(c => c.ids) : ((CF.cats.find(c => c.id === cat) || {}).ids || []);
  const l = [...new Set(ids)].map(id => m[id]).filter(c => c && (!c.star || showStar)).map(c => Object.assign({cat: CF.cats.find(k => k.ids.includes(c.id))}, c));
  // C7: o card ★ abre o baralho (a Sofia começa pela parte mais básica); os demais mantêm a ordem do conteúdo
  const i = l.findIndex(c => c.star); if (i > 0) l.unshift(l.splice(i, 1)[0]);
  return l;
}

function abrirCardEstrela(s){

}
