      const all = DB.games[kid] = DB.games[kid] || {};
      if (!G.saved){
        const prev = all[g.id];
        G.newRec = !!(prev && G.score > prev.best);
        all[g.id] = {best: Math.max(prev ? prev.best : 0, G.score), last:G.score, n:(prev?prev.n:0)+1, dt:TODAY};
        G.saved = true; SAVE();
      }
      rec = G.newRec ? '🎉 Novo recorde!' : `Seu recorde: ${all[g.id].best}/${N}`;
    }
    const th = THEME();
    body.innerHTML = `<section class="card vcard" style="text-align:center">${qhead(`${g.em} ${esc(g.title)}`, '', backBtn(), (GMETA[g.id]||{}).tag)}
      <div class="endbig">${th.ico}</div><div style="font-weight:900;font-size:18px">${th.fim}</div>
      <div class="nota">${G.score}/${N}</div><div style="font-weight:800">${th.pt(G.score)} · acertos de primeira, com pista</div><div class="hint" style="margin-top:4px">${rec}</div>
      <p style="font-size:14.5px;line-height:1.5;max-width:520px;margin:12px auto">Errar com pista vale mais do que acertar no chute. Os que deram trabalho podem virar card da pilha "revisar".</p>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn" id="gAgain" style="background:var(--sc)">Jogar de novo</button></div></section>`;
    bindBack(s, body);
    savePlay();
    $('#gAgain').onclick = () => restartGame(body);
    return;
  }
  if (!G.t0) G.t0 = Date.now();
  const it = g.items[G.order[G.i]];
  let input = '';
  if (g.kind === 'choice'){
    const opts = it.opts || g.opts;
    input = `<div class="chips">${opts.map(o => {
      let c = '';
      if (G.resolved && o === it.a) c = 'good';
      else if (G.wrong && G.wrong.includes(o)) c = 'badc';
      else if (G.sel === o) c = 'on';
      return `<button class="chip ${c}" data-o="${esc(o)}" ${G.resolved?'disabled':''}>${esc(o)}</button>`; }).join('')}</div>`;
  } else if (g.kind === 'input'){
    input = `<div style="display:flex;align-items:center;gap:8px;margin:8px 0"><input class="ans-in" id="gAns" inputmode="decimal" placeholder="resposta" value="${esc(G.sel||'')}" ${G.resolved?'disabled':''}>${g.unit?`<b>${g.unit}</b>`:''}</div>`;
  } else if (g.kind === 'order'){
    if (!G.pool) G.pool = shuffle(it.seq);
    const pool = G.pool.filter(x => !G.picked.includes(x));
    const shown = G.resolved ? it.seq : G.picked;
    input = `<div class="hint">Toque nos cartões na ordem certa. Toque em um cartão já escolhido para tirá-lo.</div>
      <div class="seq" id="gSeq">${shown.map((x,i) => `<button data-p="${esc(x)}" ${G.resolved?'disabled':''}><span class="n">${i+1}</span>${esc(x)}</button>`).join('') || '<span class="hint">(a sequência aparece aqui)</span>'}</div>
      ${G.resolved ? '' : `<div class="seq pool" id="gPool">${pool.map(x => `<button data-q="${esc(x)}"><span class="n">+</span>${esc(x)}</button>`).join('')}</div>`}`;
  }
  const pistaLbl = g.kind === 'input' ? 'Minha conta / pista' : g.kind === 'order' ? 'Minha pista (por que essa ordem?)' : 'Minha pista';
  const meta = GMETA[g.id] || {}, th = THEME();
  const icon = (meta.ic && meta.ic[it.q]) || g.em;
  body.innerHTML = `<section class="card vcard">
    ${qhead(`${g.em} ${esc(g.title)}`, esc(g.desc), `<span class="score">${th.pt(G.score)}</span><button class="hb" id="gRestart" title="Recomeçar o jogo do início">↺ Recomeçar</button>${backBtn()}`, meta.tag)}
    <div class="rule"><b>Como pontuar:</b> acertou de primeira e com pista = 1 ${isKid() ? (USER.kid==='joao' ? 'gol ⚽' : 'estrela ✦') : 'ponto'}. Errou? Vem uma dica e você tenta de novo; na segunda tentativa não pontua, mas a resposta aparece.</div>
    <div class="prog"><i style="width:${Math.round(G.i/N*100)}%"></i></div>
    <div class="hint" style="margin:0 0 6px">Desafio ${G.i+1} de ${N}</div>
    ${it.sub ? `<div class="gsub">${esc(it.sub)}</div>` : ''}
    <div class="scene"><div class="em">${icon}</div><div class="tx">${esc(it.q)}</div></div>
    <div class="qlabel">${esc(meta.ask || (g.kind === 'order' ? 'Monte a sequência:' : 'Minha resposta:'))}</div>
    ${input}
    <label class="qlabel" for="gPista" style="display:block">${pistaLbl}</label>
    <input class="pista" id="gPista" placeholder="${g.kind==='input'?'ex.: 3 × 2 × 2':'é ___ porque ___'}" value="${esc(G.pista||'')}" ${G.resolved?'disabled':''} maxlength="200">
    <div id="gFb">${G.fb||''}</div>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">${G.resolved ? `<button class="btn" id="gNext" style="background:var(--sc)">${G.i+1<N?'Próximo →':'Ver resultado'}</button>` : `<button class="btn" id="gChk" style="background:var(--sc)">Conferir</button>`}</div>
    ${focusHTML(g)}
  </section>`;
  bindBack(s, body);
  savePlay();
  const rb = $('#gRestart'); rb.onclick = () => tapConfirm(rb, G.i > 0 || G.resolved || G.tries, () => restartGame(body));
  const pi = $('#gPista'); pi.oninput = () => { G.pista = pi.value; savePlay(); };
  if (g.kind === 'choice') $$('.chip', body).forEach(b => b.onclick = () => { G.sel = b.dataset.o; G.fb = ''; G.wrong = G.wrong && G.wrong.filter(x=>x!==G.sel); renderGame(body); });
  if (g.kind === 'input'){ const a = $('#gAns'); a.oninput = () => { G.sel = a.value; savePlay(); }; a.onkeydown = e => { if (e.key==='Enter') $('#gChk') && $('#gChk').click(); }; }
  if (g.kind === 'order'){
    $$('#gPool button', body).forEach(b => b.onclick = () => { G.picked.push(b.dataset.q); G.fb=''; renderGame(body); });
    $$('#gSeq button', body).forEach(b => b.onclick = () => { G.picked = G.picked.filter(x => x !== b.dataset.p); G.fb=''; renderGame(body); });
  }
  if ($('#gChk')) $('#gChk').onclick = () => checkAnswer(body);
  if ($('#gNext')) $('#gNext').onclick = () => {
    G.i++; G.tries = 0; G.resolved = false; G.sel = null; G.pista = ''; G.fb = ''; G.wrong = null; G.picked = []; G.pool = null;
    if (G.i >= N) G.end = true;
    renderGame(body);
  };
  if (!G.resolved && g.kind === 'input' && !G.sel) $('#gAns').focus();
}
/* =========================================================
   CIÊNCIAS · MOTORES DOS JOGOS VISUAIS
   quiz  = situação ilustrada + perguntas em botões + pistas em botões (como no Laboratório de Misturas)
   tiles = grade de cartões (natural/sintético + origem)
   sort  = arrastar e soltar nas colunas
   embed = Laboratório de Misturas aberto dentro da ferramenta
   ========================================================= */
function ciOrder(g){
  const o = shuffle(g.items.map((_,i)=>i));
  if (isKid() && USER.kid === 'sofia' && g.easy != null){ o.splice(o.indexOf(g.easy),1); o.unshift(g.easy); }  // Sofia começa por um fácil
  return o;
}
function ciRecord(g, st, score){
  if (st.saved) return;
  st.saved = true; st.end = true;
  logAttempt(st, {act: g.id, n: g.total || g.items.length, ok: score});
  if (!isKid()) return;
  const all = DB.games[USER.kid] = DB.games[USER.kid] || {};
  const prev = all[g.id];
  st.newRec = !!(prev && score > prev.best);
  all[g.id] = {best: Math.max(prev ? prev.best : 0, score), last: score, n: (prev ? prev.n : 0) + 1, dt: TODAY};
  SAVE();
}
function ciRecTxt(g, st){
  if (!isKid()) return '';
  const r = (DB.games[USER.kid] || {})[g.id];
  return st.newRec ? ' 🎉 Novo recorde!' : r ? ` Seu recorde: ${r.best}/${g.total || g.items.length}.` : '';
}
// confirmação dentro da página (o navegador pode bloquear janelas de confirmação):
// 1º toque arma o botão ("Toque de novo…"), 2º toque em até 3 s executa
function tapConfirm(btn, needConfirm, onYes, msg){
  if (!needConfirm || btn.dataset.armed === '1') return onYes();
  btn.dataset.armed = '1';
  const old = btn.innerHTML;
  btn.innerHTML = msg || '⚠️ Toque de novo para recomeçar';
  btn.classList.add('warn');
  setTimeout(() => { if (btn.isConnected && btn.dataset.armed === '1'){ btn.dataset.armed = ''; btn.innerHTML = old; btn.classList.remove('warn'); } }, 3000);
}
function ciTools(score){ return `<span class="score">${score}</span><button class="hb" id="gRestart" title="Recomeçar o jogo do início">↺ Recomeçar</button>${backBtn()}`; }
function ciBind(s, g, st, body){
  if (!st.t0) st.t0 = Date.now();   // início da atividade (para o tempo de execução no relatório)
  bindBack(s, body); savePlay();
  const r = $('#gRestart', body);
  if (r) r.onclick = () => tapConfirm(r, st.i > 0 && !st.end, () => {
    const k = gmKey(s, g.id); GMS[k] = CIK[g.kind].create(g); CIK[g.kind].render(s, g, GMS[k], body);
    savePlay(); window.scrollTo(0, Math.max(0, body.getBoundingClientRect().top + scrollY - 70));
    toast('Jogo recomeçado do início.');
  });
  // animação de retorno visual (acerto = pulo, erro = tremida)
  if (st.anim){ const a = st.anim; st.anim = null; requestAnimationFrame(() => { const el = $(a.sel, body); if (el){ el.classList.remove(a.c); void el.offsetWidth; el.classList.add(a.c); } }); }
}

/* ---- quiz ilustrado com pistas em botões ---- */
function ciEval(g, it, Q){
  const wrongQ = g.qs.filter(q => !q.ok(it, Q.sel[q.key]));
  let pv = {ok:true, completa:false, certas:[], erradas:[], precisa:0, validas:[], aceitas:[]};
  if (g.pistas){
    const validas = g.pistas.valid(it), aceitas = g.pistas.accept ? g.pistas.accept(it) : [];
    const tipoOk = !wrongQ.length, marc = Q.pis;
    const certas = tipoOk ? marc.filter(k => validas.includes(k)) : [];
    const erradas = tipoOk ? marc.filter(k => !validas.includes(k) && !aceitas.includes(k)) : marc.slice();
    const precisa = validas.length >= 3 ? 2 : 1;
    pv = {ok: tipoOk && certas.length >= precisa && !erradas.length, completa: tipoOk && !erradas.length && certas.length === validas.length, certas, erradas, precisa, validas, aceitas};
  }
  return {wrongQ, pv, ok: !wrongQ.length && pv.ok};
}
function ciQuizRender(s, g, Q, body){
  const th = THEME(), N = g.items.length, idx = Q.order[Q.pos], it = g.items[idx];
  Q.i = Q.done;
  const ev = Q.answered ? ciEval(g, it, Q) : null;
  const qsH = g.qs.map(q => `<div class="qlabel">${q.label}</div><div class="chips">${q.opts(it).map(([v,t]) => {
    let c = '';
    if (Q.answered){ if (q.ok(it, v)) c = 'good'; else if (Q.sel[q.key] === v) c = 'badc'; }
    else if (Q.sel[q.key] === v) c = 'on';
    return `<button class="chip ${c}" data-q="${q.key}" data-v="${esc(v)}" ${Q.answered?'disabled':''}>${t}</button>`;
  }).join('')}</div>`).join('');
  let pisH = '';
  if (g.pistas){
    const op = g.pistas.opts(it, Q.sel);
    pisH = `<div class="qlabel">⭐ ${g.pistas.label(Q.sel)}</div>` + (op ? `<div class="chips">${Object.entries(op).map(([k,t]) => {
      let c = Q.pis.includes(k) ? 'on' : '';
      if (ev){ if (Q.pis.includes(k)) c = ev.pv.erradas.includes(k) ? 'badc' : 'good'; else if (!ev.wrongQ.length && ev.pv.validas.includes(k)) c = 'miss'; }
      return `<button class="chip ${c}" data-p="${k}" ${Q.answered?'disabled':''}>${t}</button>`;
    }).join('')}</div>` : `<div class="hint" style="margin:4px 0">${g.pistas.empty}</div>`);
  }
  const btn = !Q.answered ? `<button class="btn" id="ciOk" style="background:var(--sc)">Conferir</button>`
            : !Q.finished ? `<button class="btn" id="ciNext" style="background:var(--sc)">Próxima →</button>`
            : `<button class="btn" id="ciAgain" style="background:var(--sc)">🔁 Jogar de novo</button>`;
  body.innerHTML = `<section class="card vcard">
    ${qhead(`${g.em} ${esc(g.title)}`, esc(g.desc), ciTools(th.pt(Q.first) + (g.pistas ? ` · ⭐ ${Q.full}` : '')), g.tag)}
    <div class="rule">${g.rule}</div>
    <div class="prog"><i style="width:${Q.finished ? 100 : Math.round(Q.pos/N*100)}%"></i></div>
    <div class="qwrap ${g.onecol ? 'one' : ''}" id="ciWrap">
      <div class="${g.onecol ? '' : 'sbox'}" id="ciPic">${g.pic(it, idx)}</div>
      <div>
        <div class="hint" style="margin:0">${g.unit} ${Q.pos+1} de ${N}</div>
        ${g.name ? `<div class="qname">${esc(g.name(it))}</div>` : ''}
        ${g.desc2 ? `<div class="hint" style="margin:0 0 4px">${esc(g.desc2(it))}</div>` : ''}
        ${qsH}${pisH}
        <div class="gbtns">${btn}</div>
      </div>
    </div>
    <div id="ciFb">${Q.fb || ''}</div>
    ${focusHTML(g)}
  </section>`;
  ciBind(s, g, Q, body);
  const R = () => ciQuizRender(s, g, Q, body);
  $$('[data-q]', body).forEach(b => b.onclick = () => {
    if (Q.answered) return;
    const v = b.dataset.v; Q.sel[b.dataset.q] = isNaN(+v) ? v : +v;
    if (g.pistas && g.pistas.resetOn === b.dataset.q) Q.pis = [];
    Q.fb = ''; R();
  });
  $$('[data-p]', body).forEach(b => b.onclick = () => {
    if (Q.answered) return;
    const k = b.dataset.p; Q.pis = Q.pis.includes(k) ? Q.pis.filter(x => x !== k) : Q.pis.concat([k]);
    Q.fb = ''; R();
  });
  if ($('#ciOk')) $('#ciOk').onclick = () => ciQuizCheck(s, g, Q, body);
  if ($('#ciNext')) $('#ciNext').onclick = () => { Object.assign(Q, {pos:Q.pos+1, sel:{}, pis:[], tries:0, answered:false, fb:''}); R(); };
  if ($('#ciAgain')) $('#ciAgain').onclick = () => { const k = gmKey(s, g.id); GMS[k] = CIK.quiz.create(g); ciQuizRender(s, g, GMS[k], body); };
}
function ciQuizCheck(s, g, Q, body){
  const it = g.items[Q.order[Q.pos]], th = THEME();
  const R = () => ciQuizRender(s, g, Q, body);
  if (g.qs.some(q => Q.sel[q.key] == null)){ Q.fb = `<div class="fbk warn">${g.qs.length > 1 ? 'Responda todas as perguntas.' : 'Escolha uma resposta.'}</div>`; return R(); }
  if (g.pistas && !Q.pis.length){ Q.fb = `<div class="fbk warn">⭐ <b>A resposta só vale com pista!</b> Marque pelo menos uma.</div>`; return R(); }
  const ev = ciEval(g, it, Q);
  Q.tries++;
  if (!ev.ok && Q.tries === 1){
    Q.fb = `<div class="fbk warn">🔎 <b>Ainda não.</b> ${g.hint(it, ev.wrongQ.map(q => q.key), ev.pv)}<br><span class="hint">Mude o que achar necessário e confira de novo. A resposta aparece na próxima tentativa.</span></div>`;
    Q.anim = {sel:'#ciWrap', c:'shake'}; return R();
  }
  Q.answered = true; Q.done++;
  const primeira = Q.tries === 1;
  if (ev.ok){ Q.score++; if (primeira) Q.first++; if (g.pistas && ev.pv.completa) Q.full++; }
  let motivo = '';
  if (!ev.ok){
    if (ev.wrongQ.length) motivo = 'A resposta não bateu. ';
    else if (ev.pv.erradas.length) motivo = `Pista que não serve aqui: ${ev.pv.erradas.map(k => g.pistas.nome(k)).join('; ')}. `;
    else if (ev.pv.certas.length < ev.pv.precisa) motivo = `Precisava marcar pelo menos ${ev.pv.precisa} pistas certas. `;
  }
  const head = ev.ok ? (g.pistas && ev.pv.completa ? `<b>${primeira ? th.ok : th.ok2}</b> ⭐ <b>Pista completa!</b>` : `<b>${primeira ? th.ok : th.ok2}</b> ${primeira ? 'De primeira!' : 'Acertou na 2ª tentativa.'}`) : '📘 <b>Veja a resposta:</b>';
  Q.fb = `<div class="fbk ${ev.ok ? 'ok' : 'no'}">${head} ${motivo}${g.explain(it)}` +
    (g.pistas ? `<br><span class="hint">Pistas certas: ${ev.pv.validas.map(k => g.pistas.nome(k)).join('; ')}.${ev.pv.aceitas.length ? ' Também vale: ' + ev.pv.aceitas.map(k => g.pistas.nome(k)).join('; ') + '.' : ''}</span>` : '') + `</div>`;
  Q.anim = ev.ok ? {sel:'#ciPic', c:'pop'} : {sel:'#ciWrap', c:'shake'};
  if (Q.pos === g.items.length - 1){
    Q.finished = true; ciRecord(g, Q, Q.first);
    Q.fb += `<div class="fbk ok" style="margin-top:8px">🏁 <b>${th.fim}</b> ${Q.score} de ${g.items.length} certas (${th.pt(Q.first)} de primeira)${g.pistas ? `, ⭐ ${Q.full} com pista completa` : ''}.${ciRecTxt(g, Q)}</div>`;
  }
  R();
}

/* ---- grade de cartões: natural ou sintético + origem ---- */
// C10: como nos outros jogos, o 1º erro de cada parte mostra só uma dica; a resposta aparece na 2ª tentativa.
// Ponto = as duas partes certas de primeira (st.tT / st.tO guardam o 1º erro de cada cartão).
const CI_TILE_DICA = {
  tipo: 'Pergunte: dá para encontrar esse material pronto na natureza e usá-lo quase como está, ou ele é fabricado na indústria por transformação química?',
  N: 'Pense de onde ele vem: de uma planta, de um animal ou do solo e das rochas?',
  S: 'Pense na matéria-prima: de onde a indústria tira o material para fabricá-lo?'
};
function ciTilesRender(s, g, st, body){
  const th = THEME(), N = g.items.length, I = i => g.items[i];
  st.tT = st.tT || {}; st.tO = st.tO || {};
  const okC = Object.entries(st.ans).filter(([i,v]) => I(i)[2] === v && !st.tT[i]).length;
  const okO = Object.entries(st.orig).filter(([i,v]) => I(i)[4] === v && !st.tO[i]).length;
  const both = Object.keys(st.orig).filter(i => st.ans[i] === I(i)[2] && !st.tT[i] && st.orig[i] === I(i)[4] && !st.tO[i]).length;
  st.i = Object.keys(st.ans).length;
  const tiles = st.order.map(i => {
    const it = I(i), a = st.ans[i], o = st.orig[i];
    const cls = (a && o) ? (a === it[2] && o === it[4] ? 'ok' : 'no') : '';
    let h = `<div class="mitem ${cls}" id="mt${i}"><div class="em">${it[0]}</div><div class="nmm">${esc(it[1])}</div>`;
    if (!a){
      const e1 = st.tT[i];
      h += `<div class="bb"><button data-ms="${i}" data-v="N" ${e1 === 'N' ? 'disabled' : ''}>🌿 Natural</button><button data-ms="${i}" data-v="S" ${e1 === 'S' ? 'disabled' : ''}>🏭 Sintético</button></div>`;
      if (e1) h += `<div class="res b">🔎 Ainda não.</div><div class="why">${CI_TILE_DICA.tipo}</div>`;
    } else {
      h += `<div class="res ${a === it[2] ? 'g' : 'b'}">${a === it[2] ? '✓' : '✗'} ${it[2] === 'N' ? 'Natural' : 'Sintético'}${st.tT[i] ? ' (na 2ª tentativa)' : ''}</div><div class="why">${esc(it[3])}</div>`;
      const opts = it[2] === 'N' ? ['vegetal','animal','mineral'] : ['petroleo','vegetal','animal','mineral'];
      if (!o){
        const e2 = st.tO[i];
        h += `<div class="ask">${it[2] === 'N' ? 'De onde ele vem?' : 'Qual é a matéria-prima?'}</div><div class="bb wrap">${opts.map(k => `<button data-mo="${i}" data-v="${k}" ${e2 === k ? 'disabled' : ''}>${CI_ORIG[k]}</button>`).join('')}</div>`;
        if (e2) h += `<div class="res b">🔎 Ainda não.</div><div class="why">${CI_TILE_DICA[it[2]]}</div>`;
      } else {
        h += (o === it[4] ? `<div class="res g">✓ ${it[2] === 'N' ? 'Origem' : 'Matéria-prima'}: ${CI_ORIG[it[4]]}${st.tO[i] ? ' (na 2ª tentativa)' : ''}</div>` : `<div class="res b">✗ Você marcou ${CI_ORIG[o]}</div><div class="res g">Certo: ${CI_ORIG[it[4]]}</div>`) + `<div class="why">${esc(it[5])}</div>`;
      }
    }
    return h + '</div>';
  }).join('');
  const fim = Object.keys(st.orig).length === N;
  body.innerHTML = `<section class="card vcard">
    ${qhead(`${g.em} ${esc(g.title)}`, esc(g.desc), ciTools(`Tipo ${okC}/${N} · Origem ${okO}/${N}`), g.tag)}
    <div class="rule"><b>Como jogar:</b> toque em <b>🌿 Natural</b> (vem da natureza e é usado quase como está) ou <b>🏭 Sintético</b> (fabricado na indústria por transformação química). Depois diga de onde ele vem. Cartão certo de primeira nas duas partes = 1 ${isKid() ? (USER.kid === 'joao' ? 'gol ⚽' : 'estrela ✦') : 'ponto'}. Errou? Primeiro vem uma dica; a resposta aparece na segunda tentativa.</div>
    <div class="prog"><i style="width:${Math.round(Object.keys(st.orig).length/N*100)}%"></i></div>
    <div class="mgrid">${tiles}</div>
    ${fim ? `<div class="fbk ok" style="margin-top:10px">🏁 <b>${th.fim}</b> Natural ou sintético: <b>${okC} de ${N}</b> de primeira · Origem ou matéria-prima: <b>${okO} de ${N}</b> de primeira · ${th.pt(both)}. Repare: quase todos os sintéticos vêm do petróleo.${ciRecTxt(g, st)}</div><div class="gbtns"><button class="btn" id="ciAgain" style="background:var(--sc)">🔁 Jogar de novo</button></div>` : ''}
  </section>`;
  ciBind(s, g, st, body);
  $$('[data-ms]', body).forEach(b => b.onclick = () => {
    const i = b.dataset.ms, v = b.dataset.v, ok = I(i)[2] === v;
    if (!ok && !st.tT[i]){ st.tT[i] = v; toast('🔎 Ainda não. Leia a dica no cartão.'); st.anim = {sel:'#mt'+i, c:'shake'}; return ciTilesRender(s, g, st, body); }
    st.ans[i] = v;
    toast(ok ? (st.tT[i] ? th.ok2 : th.ok) : '📘 Leia o porquê no cartão.');
    st.anim = {sel:'#mt'+i, c: ok ? 'pop' : 'shake'};
    ciTilesRender(s, g, st, body);
  });
  $$('[data-mo]', body).forEach(b => b.onclick = () => {
    const i = b.dataset.mo, v = b.dataset.v, certo = v === I(i)[4];
    if (!certo && !st.tO[i]){ st.tO[i] = v; toast('🔎 Ainda não. Leia a dica no cartão.'); st.anim = {sel:'#mt'+i, c:'shake'}; return ciTilesRender(s, g, st, body); }
    st.orig[i] = v;
    const ok = st.ans[i] === I(i)[2] && certo;
    toast(ok ? (st.tO[i] ? th.ok2 : th.ok) : '📘 Veja a origem certa no cartão.');
    st.anim = {sel:'#mt'+i, c: ok ? 'pop' : 'shake'};
    if (Object.keys(st.orig).length === N){
      const sc = Object.keys(st.orig).filter(k => st.ans[k] === I(k)[2] && !st.tT[k] && st.orig[k] === I(k)[4] && !st.tO[k]).length;
      ciRecord(g, st, sc);
    }
    ciTilesRender(s, g, st, body);
  });
  if ($('#ciAgain')) $('#ciAgain').onclick = () => { const k = gmKey(s, g.id); GMS[k] = CIK.tiles.create(g); ciTilesRender(s, g, GMS[k], body); };
}

/* ---- arrastar e soltar: monte a tabela ---- */
function ciSortHint(it, col){
  if (col === 'pura') return 'Olhe de novo: tem mais de um componente? Algo dissolvido também conta como componente.';
  if (col === 'homo') return it.t === 'pura' ? 'Será que tem mesmo mais de um componente?' : 'Dá para ver partes diferentes (camadas, fundo, bolhas)?';
  return it.t === 'pura' ? 'Ver duas partes não quer dizer que é mistura: quantos componentes tem?' : 'Dá para ver as partes? O que está dissolvido não forma uma fase separada.';
}
function ciSortRender(s, g, st, body){
  const th = THEME(), N = g.items.length;
  st.i = Object.keys(st.placed).length;
  const pool = st.order.filter(i => !st.placed[i]);
  const card = (i, placed) => {
    const it = g.items[i], p = st.placed[i];
    return `<div class="scard ${placed ? (p.first ? 'okp' : 'shown') : ''} ${st.sel === i ? 'sel' : ''}" id="sc${i}" data-c="${i}" ${placed ? '' : 'tabindex="0" role="button" aria-label="' + esc(it.n) + '"'}>
      <div class="sthumb">${ciSySVG(it)}</div><div class="sname">${esc(it.n)}</div>${placed ? `<div class="smark">${p.first ? '✓' : '📘'}</div>` : ''}</div>`;
  };
  const cols = CI_COLS.map(([k, em, nm, sub]) => `<div class="scol" data-col="${k}" id="col-${k}"><div class="sch"><span class="sem">${em}</span><div><b>${nm}</b><small>${sub}</small></div></div>
    <div class="sin">${st.order.filter(i => st.placed[i] && st.placed[i].col === k).map(i => card(i, true)).join('')}</div></div>`).join('');
  const fim = st.i === N;
  body.innerHTML = `<section class="card vcard">
    ${qhead(`${g.em} ${esc(g.title)}`, esc(g.desc), ciTools(th.pt(st.score)), g.tag)}
    <div class="rule"><b>Como jogar:</b> arraste o béquer até a coluna certa, ou toque no béquer e depois na coluna. Acertou de primeira = 1 ${isKid() ? (USER.kid === 'joao' ? 'gol ⚽' : 'estrela ✦') : 'ponto'}. Errou? Vem uma dica; no 2º erro o béquer vai sozinho para o lugar certo (📘).</div>
    <div class="prog"><i style="width:${Math.round(st.i/N*100)}%"></i></div>
    <div class="qlabel" style="margin-top:4px">Béqueres para classificar (${pool.length})</div>
    <div class="spool">${pool.map(i => card(i, false)).join('') || '<div class="hint">Todos os béqueres estão na tabela!</div>'}</div>
    <div class="sboard" id="sBoard">${cols}</div>
    <div id="ciFb">${st.fb || ''}</div>
    ${fim ? `<div class="gbtns"><button class="btn" id="ciAgain" style="background:var(--sc)">🔁 Jogar de novo</button></div>` : ''}
  </section>`;
  ciBind(s, g, st, body);
  let drag = null, ghost = null;
  const clear = () => { if (ghost){ ghost.remove(); ghost = null; } $$('.scol', body).forEach(c => c.classList.remove('hov')); $('#sBoard', body).classList.remove('sdrag'); };
  const colAt = (x, y) => { const el = document.elementFromPoint(x, y); const c = el && el.closest('.scol'); return c && body.contains(c) ? c : null; };
  $$('.spool .scard', body).forEach(el => {
    const i = +el.dataset.c;
    el.onpointerdown = e => { if (e.button > 0) return; drag = {x:e.clientX, y:e.clientY, moved:false}; try { el.setPointerCapture(e.pointerId); } catch(_){} };
    el.onpointermove = e => {
      if (!drag) return;
      if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6){
        drag.moved = true;
        const r = el.getBoundingClientRect(); drag.ox = e.clientX - r.left; drag.oy = e.clientY - r.top;
        ghost = el.cloneNode(true); ghost.classList.add('sghost'); ghost.style.width = r.width + 'px';
        document.body.appendChild(ghost); el.classList.add('dragging'); $('#sBoard', body).classList.add('sdrag');
      }
      if (drag.moved){
        e.preventDefault();
        ghost.style.transform = `translate(${e.clientX - drag.ox}px, ${e.clientY - drag.oy}px) rotate(-3deg)`;
        const c = colAt(e.clientX, e.clientY);
        $$('.scol', body).forEach(x => x.classList.toggle('hov', x === c));
        // rolagem automática perto das bordas (celular)
        if (e.clientY > innerHeight - 50) window.scrollBy(0, 12); else if (e.clientY < 50) window.scrollBy(0, -12);
      }
    };
    el.onpointerup = e => {
      if (!drag) return;
      const d = drag; drag = null;
      const c = d.moved ? colAt(e.clientX, e.clientY) : null;
      clear(); el.classList.remove('dragging');
      if (d.moved){ if (c) ciSortDrop(s, g, st, body, i, c.dataset.col); }
      else { st.sel = st.sel === i ? null : i; ciSortRender(s, g, st, body); }
    };
    el.onpointercancel = () => { drag = null; clear(); el.classList.remove('dragging'); };
    el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); st.sel = st.sel === i ? null : i; ciSortRender(s, g, st, body); } };
  });
  $$('.scol', body).forEach(c => c.onclick = () => {
    if (st.sel != null) ciSortDrop(s, g, st, body, st.sel, c.dataset.col);
    else if (st.i < N) toast('Primeiro toque em um béquer.');
  });
  if ($('#ciAgain')) $('#ciAgain').onclick = () => { const k = gmKey(s, g.id); GMS[k] = CIK.sort.create(g); ciSortRender(s, g, GMS[k], body); };
}
function ciSortDrop(s, g, st, body, i, col){
  const it = g.items[i], th = THEME();
  st.sel = null;
  if (col === it.t){
    const first = !st.tr[i];
    st.placed[i] = {col, first};
    if (first) st.score++;
    st.fb = `<div class="fbk ok"><b>${first ? th.ok : th.ok2}</b> ${esc(it.n)}: <b>${CI_NOMET[it.t]}</b>. ${esc(it.w)}</div>`;
    st.anim = {sel:'#sc'+i, c:'pop'};
  } else {
    st.tr[i] = (st.tr[i] || 0) + 1;
    if (st.tr[i] === 1){
      st.fb = `<div class="fbk warn">🔎 <b>Ainda não.</b> ${ciSortHint(it, col)} Tente outra coluna.</div>`;
      st.anim = {sel:'#col-'+col, c:'shake'};
    } else {
      st.placed[i] = {col: it.t, first: false};
      st.fb = `<div class="fbk no">📘 <b>Veja:</b> ${esc(it.n)} é <b>${CI_NOMET[it.t]}</b>. ${esc(it.w)}</div>`;
      st.anim = {sel:'#sc'+i, c:'pop'};
    }
  }
  toast(col === it.t ? th.ok : (st.placed[i] ? '📘 Veja a explicação abaixo.' : '🔎 Ainda não. Leia a dica.'));
  if (Object.keys(st.placed).length === g.items.length){
    ciRecord(g, st, st.score);
    st.fb += `<div class="fbk ok" style="margin-top:8px">🏁 <b>${th.fim}</b> ${th.pt(st.score)} de ${g.items.length} (acertos de primeira).${ciRecTxt(g, st)}</div>`;
  }
  ciSortRender(s, g, st, body);
}

/* =========================================================
   MATEMÁTICA · QUANTOS CUBINHOS? (material 06 do kit)
   Caixas desenhadas cubinho por cubinho, com uma cor por camada e uma régua colorida
   para cada medida. O aluno conta comprimento, largura e altura, monta a conta e
   calcula o volume; no fim compara as caixas.
   ========================================================= */
const CB_COR = [['#a9d4f5','#6aa8de','#4a86bd'],['#b3e6c6','#6cc193','#469c6c'],['#ffdca3','#f3ad4e','#cf8a2c'],['#f8c0cf','#e88aae','#c25f88'],['#d6c8f4','#a891dd','#8167bf']];
const CB_RG = {l:'#d0544b', w:'#2e9e6b', h:'#7a4fc9'};   // régua: comprimento, largura, altura
function cuboSVG(it, o = {}){
  const {l, w, h} = it, k = 0.5, gap = o.explode ? 0.7 : 0;
  const zU = z => z * (1 + gap);                         // altura (em cubos) de cada camada, com separação
  const topU = zU(h - 1) + 1;
  const lab = o.explode ? 112 : 0, pad = 26;
  const s = Math.min((300 - lab) / (l + w*k), 210 / (topU + w*k), 44);
  const W = pad*2 + (l + w*k)*s + lab, H = pad*2 + (topU + w*k)*s;
  const base = pad + topU*s + w*s*k, x0 = pad;
  const sw = s < 14 ? .5 : 1;
  let g = '';
  for (let y = w - 1; y >= 0; y--) for (let z = 0; z < h; z++) for (let x = 0; x < l; x++){
    if (!o.explode && !(x === l-1 || y === 0 || z === h-1)) continue;   // cubinhos escondidos não precisam ser desenhados
    const [ct, cf, cs] = CB_COR[z % CB_COR.length];
    const X = x0 + x*s + y*s*k, Y = base - zU(z)*s - y*s*k, d = s*k;
    g += `<polygon points="${X},${Y-s} ${X+s},${Y-s} ${X+s+d},${Y-s-d} ${X+d},${Y-s-d}" fill="${ct}" stroke="#1f4f5c" stroke-width="${sw}"/>`
       + `<polygon points="${X+s},${Y} ${X+s},${Y-s} ${X+s+d},${Y-s-d} ${X+s+d},${Y-d}" fill="${cs}" stroke="#1f4f5c" stroke-width="${sw}"/>`
       + `<rect x="${X}" y="${Y-s}" width="${s}" height="${s}" fill="${cf}" stroke="#1f4f5c" stroke-width="${sw}"/>`;
  }
  // réguas coloridas com um tracinho por cubinho
  const tick = (x1, y1, x2, y2, n, cor) => { let t = `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${cor}" stroke-width="4" stroke-linecap="round"/>`;
    if (n <= 12) for (let i = 0; i <= n; i++){ const px = x1 + (x2-x1)*i/n, py = y1 + (y2-y1)*i/n; t += `<circle cx="${px}" cy="${py}" r="2.6" fill="#fff" stroke="${cor}" stroke-width="1.6"/>`; } return t; };
  const lbl = (x, y, t, cor, a = 'middle') => `<text x="${x}" y="${y}" text-anchor="${a}" font-size="14" font-weight="900" fill="${cor}" font-family="Nunito,sans-serif">${t}</text>`;
  const by = base + 9;
  g += tick(x0, by, x0 + l*s, by, l, CB_RG.l);
  g += tick(x0 + l*s + 7, base + 4, x0 + l*s + w*s*k + 7, base - w*s*k + 4, w, CB_RG.w);
  if (!o.explode) g += tick(x0 - 9, base, x0 - 9, base - h*s, h, CB_RG.h);
  if (o.labels){
    g += lbl(x0 + l*s/2, by + 17, `${l}`, CB_RG.l) + lbl(x0 + l*s + w*s*k/2 + 16, base - w*s*k/2 + 16, `${w}`, CB_RG.w, 'start');
    if (!o.explode) g += lbl(x0 - 15, base - h*s/2 + 5, `${h}`, CB_RG.h, 'end');
  }
  if (o.explode){
    const n = l*w, max = h > 6 ? [0, h-1] : [...Array(h).keys()];
    max.forEach(z => { const Y = base - zU(z)*s - s/2 - w*s*k/2; g += `<text x="${x0 + (l + w*k)*s + 12}" y="${Y + 5}" font-size="12.5" font-weight="900" fill="${CB_COR[z % CB_COR.length][2]}" font-family="Nunito,sans-serif">camada ${z+1}${o.labels ? `: ${l} × ${w} = ${n}` : ''}</text>`; });   // a conta da camada só aparece depois da resposta
    if (h > 6) g += `<text x="${x0 + (l + w*k)*s + 12}" y="${pad + H/2 - 10}" font-size="12" font-weight="800" fill="#5f7680" font-family="Nunito,sans-serif">… ${h} camadas iguais</text>`;
  }
  return `<svg viewBox="0 0 ${W.toFixed(0)} ${H.toFixed(0)}" role="img" aria-label="${esc(it.nome || 'caixa de cubinhos')}">${g}</svg>`;
}
function cbNew(g){ return {kind:'cubos', order: g.items.map((_,i) => i), pos:0, vals:{}, sel:null, tries:0, answered:false, score:0, first:0, done:0, fb:'', explode:false, finished:false, res:{}, wrong:{}, i:0}; }

      <div class="cdims">${it.cubo ? field('a', 'Aresta (cm)', CB_RG.l) : field('l', 'Comprimento', CB_RG.l) + field('w', 'Largura', CB_RG.w) + field('h', 'Altura', CB_RG.h)}</div>
      <div class="conta">Conta: <b id="cbConta">${contaTxt}</b> =</div>

    right = `<div class="hint" style="margin:0">Desafio ${st.pos+1} de ${N}</div>
      <div class="qname">Comparando as caixas</div>
      <div class="hint" style="margin:0 0 6px">${esc(it.q)}</div>
      <div class="chips">${it.opts.map(o => { let c = ''; if (st.answered){ if (o === it.a) c = 'good'; else if (st.sel === o) c = 'badc'; } else if (st.sel === o) c = 'on'; return `<button class="chip ${c}" data-o="${esc(o)}" ${st.answered ? 'disabled' : ''}>${esc(o)}</button>`; }).join('')}</div>
      <div class="gbtns">${!st.answered ? `<button class="btn" id="cbOk" style="background:var(--sc)">Conferir</button>` : !st.finished ? `<button class="btn" id="cbNext" style="background:var(--sc)">Próximo →</button>` : `<button class="btn" id="cbAgain" style="background:var(--sc)">🔁 Jogar de novo</button>`}</div>`;
  }
  const tabela = st.finished ? `<div class="qlabel" style="margin-top:12px">Minha tabela (como no material 06)</div>
    <div style="overflow-x:auto"><table class="ctab"><tr><th>Caixa</th><th style="color:${CB_RG.l}">Comprimento</th><th style="color:${CB_RG.w}">Largura</th><th style="color:${CB_RG.h}">Altura</th><th>Conta</th><th>Volume</th><th></th></tr>
    ${g.items.filter(x => !x.comp).map((c, i) => { const r = st.res[i] || {}; return `<tr><td><b>${esc(c.nome)}</b></td><td>${c.l}</td><td>${c.w}</td><td>${c.h}</td><td>${c.l} × ${c.w} × ${c.h}</td><td><b>${c.l*c.w*c.h} cm³</b></td><td>${r.first ? '✓' : '📘'}</td></tr>`; }).join('')}</table></div>` : '';
  body.innerHTML = `<section class="card vcard">
    ${qhead(`${g.em} ${esc(g.title)}`, esc(g.desc), ciTools(th.pt(st.first)), 'Cap. 15')}
    <div class="rule"><b>Como jogar:</b> conte quantos cubinhos tem cada medida seguindo as réguas coloridas (<b style="color:${CB_RG.l}">comprimento</b>, <b style="color:${CB_RG.w}">largura</b>, <b style="color:${CB_RG.h}">altura</b>). Cada cor de cubinho é uma camada. A conta é a sua pista. Acertou de primeira = 1 ${ptsTxt}. Errou? Vem uma dica; no 2º erro aparece a resposta.</div>
    <div class="prog"><i style="width:${st.finished ? 100 : Math.round(st.pos/N*100)}%"></i></div>

    <div id="ciFb">${st.fb || ''}</div>
    ${st.finished ? `<div class="fbk ok" style="margin-top:8px">🏁 <b>${th.fim}</b> ${th.pt(st.first)} de ${N} desafios de primeira.${ciRecTxt(g, st)}</div>` : ''}
    ${tabela}

  </section>`;
  ciBind(s, g, st, body);
  const R = () => cbRender(s, g, st, body);
  if ($('#cbExp')) $('#cbExp').onclick = () => { st.explode = !st.explode; savePlay(); $('#cbPic').innerHTML = cuboSVG(it, {explode: st.explode, labels: st.answered}); $('#cbExp').textContent = st.explode ? '🧊 Juntar as camadas' : '🧱 Separar as camadas'; };

  if ($('#cbAgain')) $('#cbAgain').onclick = () => { const k = gmKey(s, g.id); GMS[k] = CIK.cubos.create(g); cbRender(s, g, GMS[k], body); };

function cbCheck(s, g, st, body){
  const th = THEME(), idx = st.order[st.pos], it = g.items[idx], R = () => cbRender(s, g, st, body);
  const right = (msg) => {
    const first = st.tries === 0;
    st.answered = true; st.done++; st.score++; if (first) st.first++;
    st.res[idx] = {first};
    st.fb = `<div class="fbk ok"><b>${first ? th.ok : th.ok2}</b> ${msg}</div>`;
    st.anim = {sel: it.comp ? '#cbWrap' : '#cbPic', c:'pop'};
  };
  const reveal = (msg) => { st.answered = true; st.done++; st.res[idx] = {first:false}; st.fb = `<div class="fbk no">📘 <b>Veja a resposta:</b> ${msg}</div>`; st.anim = {sel:'#cbWrap', c:'shake'}; };
  const end = () => { if (st.pos === g.items.length - 1){ st.finished = true; ciRecord(g, st, st.first); } };
  if (it.comp){
    if (!st.sel){ st.fb = '<div class="fbk warn">Escolha uma resposta.</div>'; return R(); }
    if (st.sel === it.a) right(esc(it.why));
    else if (st.tries === 0){ st.tries = 1; st.fb = `<div class="fbk warn">🔎 <b>Ainda não.</b> Olhe o volume de cada caixa embaixo dos desenhos e compare os números. Caixas com formatos diferentes podem ter o mesmo volume.</div>`; st.anim = {sel:'#cbWrap', c:'shake'}; st.sel = null; return R(); }
    else reveal(`<b>${esc(it.a)}</b>. ${esc(it.why)}`);
    end(); return R();
  }
  const keys = it.cubo ? ['a','v'] : ['l','w','h','v'];
  if (keys.some(k => !st.vals[k])){ st.fb = `<div class="fbk warn">✋ Preencha ${it.cubo ? 'a aresta' : 'as três medidas'} e o volume. A conta é a sua pista!</div>`; return R(); }
  const n = k => +st.vals[k], V = it.l * it.w * it.h;
  const real = it.cubo ? {a: it.l} : {l: it.l, w: it.w, h: it.h};
  const dimKeys = Object.keys(real);
  const dimOk = dimKeys.every(k => n(k) === real[k]), volOk = n('v') === V;
  const camada = `Camada de baixo: ${it.l} × ${it.w} = <b>${it.l*it.w}</b> cubinhos; são <b>${it.h}</b> camada${it.h > 1 ? 's' : ''}: ${it.l*it.w} × ${it.h} = <b>${V} cm³</b>.${it.extra ? ' ' + it.extra : ''}`;
  if (dimOk && volOk){ right(`${it.l} × ${it.w} × ${it.h} = ${V} cm³. ${camada}`); end(); return R(); }
  dimKeys.concat(['v']).forEach(k => st.wrong[k] = k === 'v' ? !volOk : n(k) !== real[k]);
  if (st.tries === 0){
    st.tries = 1;
    let dica;
    const nomes = {l:'comprimento (régua vermelha)', w:'largura (régua verde)', h:'altura (régua roxa)', a:'aresta (conte os cubinhos de um lado)'};
    const erradas = dimKeys.filter(k => n(k) !== real[k]);
    if (!it.cubo && erradas.length && [n('l'), n('w'), n('h')].sort().join() === [it.l, it.w, it.h].sort().join())
      dica = 'Os números das medidas estão certos, mas em lugares trocados. Siga a cor de cada régua no desenho.';
    else if (erradas.length) dica = `Confira ${erradas.map(k => nomes[k]).join(' e ')}: conte um cubinho por tracinho da régua. As camadas foram separadas para ajudar a contar.`;
    else if (n('v') === (it.cubo ? it.l*3 : it.l + it.w + it.h)) dica = 'Parece que você <b>somou</b> as medidas. No volume, a gente <b>multiplica</b>: comprimento × largura × altura.';
    else dica = `As medidas estão certas! Refaça a conta em duas partes: primeiro a camada de baixo (${it.cubo ? 'aresta × aresta' : 'comprimento × largura'}), depois vezes a altura. Veja as camadas separadas no desenho.`;
    st.fb = `<div class="fbk warn">🔎 <b>Ainda não.</b> ${dica}</div>`;
    st.explode = true; st.anim = {sel:'#cbWrap', c:'shake'};
    return R();
  }
  st.vals = it.cubo ? {a: String(it.l), v: String(V)} : {l: String(it.l), w: String(it.w), h: String(it.h), v: String(V)};
  st.wrong = {}; st.explode = true;
  reveal(`${it.l} × ${it.w} × ${it.h} = <b>${V} cm³</b>. ${camada}`);
  end(); R();
}

/* =========================================================

const CV_LAD = {

  ['vol',4,'dm³','cm³',4000,1,'e'], ['vol',2,'m³','dm³',2000,1,'f'], ['vol',1,'m³','cm³',1000000,2], ['vol',3500,'cm³','dm³',3.5,3],
  ['cap',2,'L','dL',20,1], ['cap',3000,'mL','L',3,2,'h'], ['cap',1.5,'L','mL',1500,2,'g'],

  ['cross',6,'dm³','L',6,2,'k'], ['cross',250,'cm³','mL',250,2,'l'], ['cross',2,'m³','L',2000,3]

const fmtN = n => { const neg = n < 0; let [a, b] = String(Math.abs(n)).split('.'); a = a.replace(/\B(?=(\d{3})+(?!\d))/g, ' '); return (neg ? '-' : '') + a + (b ? ',' + b : ''); };

// informações de uma questão: degraus, operação, fator total, caminho
function cvInfo(q){

  const path = (d > 0 ? L.u.slice(a, b + 1) : L.u.slice(b, a + 1).reverse());

// tabela (escada) de uma grandeza, com a unidade de partida e a de destino destacadas
function cvLadderHTML(gk, from, to){

/* ---- escada de conversão (usada na aba Tabela e na Modalidade 1 do treino) ----
   colunas = unidades (da maior para a menor); entre elas, o fator de cada casa:
   → para a direita (unidade menor) multiplica • ← para a esquerda (unidade maior) divide */
const TB_INFO = {
  comp:  {tipo:'unidade linear · 1 dimensão', nomes:['quilômetro','hectômetro','decâmetro','metro','decímetro','centímetro','milímetro']},
  massa: {tipo:'massa (base: grama)', nomes:['quilograma','hectograma','decagrama','grama','decigrama','centigrama','miligrama']},
  cap:   {tipo:'capacidade (base: litro)', nomes:['quilolitro','hectolitro','decalitro','litro','decilitro','centilitro','mililitro']},
  area:  {tipo:'unidade quadrada · 2 dimensões', nomes:['quilômetro quadrado','hectômetro quadrado','decâmetro quadrado','metro quadrado','decímetro quadrado','centímetro quadrado','milímetro quadrado']},
  vol:   {tipo:'unidade cúbica · 3 dimensões', nomes:['quilômetro cúbico','hectômetro cúbico','decâmetro cúbico','metro cúbico','decímetro cúbico','centímetro cúbico','milímetro cúbico']}
};
// desloca a vírgula k casas (k > 0 multiplica por 10^k, k < 0 divide): conta exata, sem erro de arredondamento
function shiftDec(v, k){
  let s = String(v).trim().replace(/\s/g, '').replace(',', '.');
  if (!/^\d*\.?\d+$|^\d+\.?$/.test(s)) return null;
  let [i, d = ''] = s.split('.');
  let digits = (i || '0') + d, pos = (i || '0').length + k;
  if (pos <= 0){ digits = '0'.repeat(1 - pos) + digits; pos = 1; }
  if (pos > digits.length) digits += '0'.repeat(pos - digits.length);
  const ip = digits.slice(0, pos).replace(/^0+(?=\d)/, ''), dp = digits.slice(pos).replace(/0+$/, '');
  return dp ? ip + '.' + dp : ip;
}
const fmtDec = s => { let [i, d] = String(s).split('.'); i = i.replace(/\B(?=(\d{3})+(?!\d))/g, ' '); return d ? i + ',' + d : i; };
const pow10Txt = z => fmtDec('1' + '0'.repeat(z));
const log10i = f => String(f).length - 1;        // 10 → 1, 100 → 2, 1000 → 3
function convPlan(gk, from, to){
  const L = CV_LAD[gk], a = L.u.indexOf(from), b = L.u.indexOf(to);
  if (a < 0 || b < 0) return null;
  const n = Math.abs(b - a), dir = b > a ? 'x' : b < a ? 'd' : '=';
  const path = dir === 'x' ? L.u.slice(a, b + 1) : L.u.slice(b, a + 1).reverse();
  return {L, n, dir, path, z: log10i(L.f) * n, k: (dir === 'x' ? 1 : -1) * log10i(L.f) * n};
}
function convLadder(gk, o = {}){
  const L = CV_LAD[gk], N = TB_INFO[gk].nomes;
  const a = o.from ? L.u.indexOf(o.from) : -1, b = o.to ? L.u.indexOf(o.to) : -1;
  const lo = Math.min(a, b), hi = Math.max(a, b), has = a >= 0 && b >= 0 && a !== b, desce = b > a;
  let h = '';
  L.u.forEach((u, i) => {
    const cls = [i === 3 ? 'main' : '', u === o.from ? 'from' : '', u === o.to ? 'to' : '', has && i > lo && i < hi ? 'path' : '', has && (i < lo || i > hi) ? 'dim' : ''].join(' ');
    h += `<span class="tu ${cls}" style="--c:${L.cor}"><b>${u}</b><i>${u === o.from ? 'início' : u === o.to ? 'destino' : N[i]}</i></span>`;
    if (i < 6){
      const on = has && i >= lo && i < hi;
      h += `<span class="tg ${on ? (desce ? 'onx' : 'ond') : ''} ${has && !on ? 'dim' : ''}"><em class="gx">× ${fmtN(L.f)} →</em><em class="gd">← ÷ ${fmtN(L.f)}</em></span>`;
    }
  });
  const gw = L.f >= 1000 ? 74 : L.f >= 100 ? 64 : 54;   // espaço entre as casas cabe o fator inteiro (× 10, × 100, × 1 000)
  return `<div class="tladwrap"><div class="tlad cvl" style="--gw:${gw}px">${h}</div></div>`;
}
function convSteps(gk, v, from, to){
  const P = convPlan(gk, from, to);
  if (!P) return '';
  const r = shiftDec(v, P.k);
  if (r == null) return '<div class="fbk warn">Escreva um número (pode ter vírgula, como 2,5).</div>';
  const V = fmtDec(shiftDec(v, 0));
  if (P.dir === '=') return `<div class="tstep"><div><b>Mesma unidade:</b> o valor não muda. ${V} ${from} = <b>${V} ${to}</b>.</div></div>`;
  const op = P.dir === 'x' ? '×' : '÷', each = Array(P.n).fill(`${op} ${fmtN(P.L.f)}`).join(' ');
  return `<div class="tstep">
    <div><span class="k">1 · Valor inicial</span><b>${V}</b></div>
    <div><span class="k">2 · Origem → destino</span><b>${from} → ${to}</b></div>
    <div><span class="k">3 · Caminho</span><b>${P.path.join(' → ')}</b><small>${P.n} casa${P.n > 1 ? 's' : ''} para a ${P.dir === 'x' ? 'direita (unidade menor)' : 'esquerda (unidade maior)'}</small></div>
    <div class="${P.dir === 'x' ? 'opx' : 'opd'}"><span class="k">4 · Operação</span><b>${P.n > 1 ? each + ' = ' : ''}${op} ${pow10Txt(P.z)}</b><small>${P.dir === 'x' ? 'multiplica: o número fica maior' : 'divide: o número fica menor'}</small></div>
    <div class="res"><span class="k">5 · Resultado</span><b>${V} ${op} ${pow10Txt(P.z)} = ${fmtDec(r)}</b><small>${V} ${from} = <b>${fmtDec(r)} ${to}</b></small></div>
  </div>`;
}
function cvTableFor(q){

}
// sorteia 3 questões de cada nível (a modalidade 2 evita repetir as da modalidade 1)
function cvPick(avoid){

       <div><div class="qlabel" style="margin-top:0">Operação</div><div class="chips" style="margin:4px 0 0">${[['x','× multiplicar (descer)'],['d','÷ dividir (subir)']].map(([k, t]) => `<button class="chip ${M.vals.op === k ? (M.answered ? (k === I.op ? 'good' : 'badc') : (M.res.wrong && M.res.wrong.op ? 'badc' : 'on')) : (M.answered && k === I.op ? 'good' : '')}" data-op="${k}" ${M.answered ? 'disabled' : ''}>${t}</button>`).join('')}</div></div></div>`;
  body.innerHTML = `<section class="card vcard cvm${m}">
    ${cvHead(g, st, m)}

    <div class="hint" style="margin:0">Questão ${M.pos + 1} de ${N} · <span class="tagx" style="margin:0">${LVL_TXT[q.lvl]}</span>${q.kit ? ` <span class="tagx">treino rápido ${q.kit})</span>` : ''}</div>
    <div class="scene cvq" id="cvQ"><div class="em">${q.g === 'cross' ? '🧊↔🥛' : CV_LAD[q.g].ic}</div><div class="tx">${fmtN(q.v)} ${q.from} = <span class="cvblank">?</span> ${q.to}</div></div>
    ${m === 1 ? `<div class="cvtab">${cvTableFor(q)}</div>` : `<div class="cvno">🙈 Sem tabela nesta modalidade: use as relações entre as unidades.</div>`}
    ${pista}
    <div class="qlabel">Resultado</div>
    <div class="cvres"><label class="cdim ${fcls('r')}" style="--rc:#1f4f5c"><input inputmode="decimal" data-cv="r" value="${esc(M.vals.r ?? '')}" ${M.answered ? 'disabled' : ''} aria-label="Resultado"></label><b>${q.to}</b></div>
    <div class="gbtns">${!M.answered ? `<button class="btn" id="cvOk" style="background:var(--sc)">Conferir</button>` : !M.finished ? `<button class="btn" id="cvNext" style="background:var(--sc)">Próxima →</button>` : `<button class="btn" id="cvAgain" style="background:var(--sc)">🔁 Fazer de novo</button><button class="btn sec" id="cvGoMenu">☰ Outra modalidade</button>`}</div>
    <div id="ciFb">${M.fb || ''}</div>

    ${focusHTML(g)}

  cvBindHead(s, g, st, body, m, M.done > 0 && !M.finished);
  const R = () => cvQuiz(s, g, st, body);
  $$('[data-cv]', body).forEach(inp => { inp.oninput = () => { M.vals[inp.dataset.cv] = inp.value; if (M.res.wrong) delete M.res.wrong[inp.dataset.cv === 'r' ? 'r' : 'd']; inp.closest('.cdim').classList.remove('bad','ok'); savePlay(); }; inp.onkeydown = e => { if (e.key === 'Enter' && $('#cvOk')) $('#cvOk').click(); }; });
  $$('[data-op]', body).forEach(b => b.onclick = () => { if (M.answered) return; M.vals.op = b.dataset.op; if (M.res.wrong) delete M.res.wrong.op; R(); });
  $$('[data-rel]', body).forEach(b => b.onclick = () => { if (M.answered) return; M.vals.rel = +b.dataset.rel; R(); });
  if ($('#cvOk')) $('#cvOk').onclick = () => cvCheck(s, g, st, body);
  if ($('#cvNext')) $('#cvNext').onclick = () => { Object.assign(M, {pos: M.pos + 1, vals:{}, tries:0, answered:false, fb:'', res:{}}); R(); window.scrollTo(0, Math.max(0, body.getBoundingClientRect().top + scrollY - 70)); };
  if ($('#cvAgain')) $('#cvAgain').onclick = () => { st['m' + m] = cvNewMode(m, m === 2 ? st.m1.qs : null); st['saved' + m] = false; R(); };
  if ($('#cvGoMenu')) $('#cvGoMenu').onclick = () => { st.mode = null; cvRender(s, g, st, body); };
}
function cvCheck(s, g, st, body){
  const m = st.mode, M = st['m' + m], th = THEME(), q = CV_BANK[M.qs[M.pos]], I = cvInfo(q), R = () => cvQuiz(s, g, st, body);
  const r = normNum(M.vals.r ?? '');
  if (I.cross ? M.vals.rel == null : (!M.vals.d || !M.vals.op)){ M.fb = `<div class="fbk warn">✋ A conta é a sua pista: ${I.cross ? 'escolha a relação entre volume e capacidade' : 'diga quantos degraus e se multiplica ou divide'}.</div>`; return R(); }
  if (isNaN(r)){ M.fb = '<div class="fbk warn">Escreva o resultado.</div>'; return R(); }
  const okR = Math.abs(r - q.ans) < 1e-9;
  const okD = I.cross ? true : +M.vals.d === I.d, okO = I.cross ? M.vals.rel === I.rel : M.vals.op === I.op;
  if (okR && okD && okO){
    const first = M.tries === 0;
    M.answered = true; M.done++; if (first) M.first++;
    M.fb = `<div class="fbk ok"><b>${first ? th.ok : th.ok2}</b> ${cvExplain(q)}</div>`;
    st.anim = {sel:'#cvQ', c:'pop'};
  } else if (M.tries === 0){
    M.tries = 1;
    M.res.wrong = {d: !okD, op: !okO, r: !okR};
    let dica;
    if (I.cross) dica = !okO ? `Qual unidade de volume corresponde a ${q.to}? Lembre: 1 dm³ = 1 L e 1 cm³ = 1 mL.` : 'A relação está certa; refaça a conta com ela.';
    else if (!okO) dica = I.op === 'x' ? `De ${q.from} para ${q.to} você vai para uma unidade <b>menor</b> (desce na escada): o número fica maior, então <b>multiplica</b>.` : `De ${q.from} para ${q.to} você vai para uma unidade <b>maior</b> (sobe na escada): o número fica menor, então <b>divide</b>.`;
    else if (!okD) dica = m === 1 ? `Conte os degraus na tabela: de <b>${q.from}</b> (início) até <b>${q.to}</b> (destino), um degrau por casinha.` : `Lembre a ordem: ${I.L.u.join(' → ')}. Quantas casinhas de ${q.from} até ${q.to}?`;
    else dica = `Degraus e operação certos! Agora o fator: em ${I.L.nome.toLowerCase()} cada degrau vale ${fmtN(I.L.f)}${I.L.dim ? ` (${I.L.dim})` : ''}. Com ${I.d} degrau${I.d > 1 ? 's' : ''}: ${I.op === 'x' ? '×' : '÷'} ${fmtN(I.fator)}.`;
    M.fb = `<div class="fbk warn">🔎 <b>Ainda não.</b> ${dica} Tente de novo.</div>`;
    st.anim = {sel:'#cvQ', c:'shake'};
  } else {
    M.answered = true; M.done++;
    M.vals = I.cross ? {rel: I.rel, r: String(q.ans).replace('.', ',')} : {d: String(I.d), op: I.op, r: String(q.ans).replace('.', ',')};
    M.res = {};
    M.fb = `<div class="fbk no">📘 <b>Veja como fazer:</b> ${cvExplain(q)}${m === 2 ? `<div style="margin-top:8px">${cvTableFor(q)}</div>` : ''}</div>`;
    st.anim = {sel:'#cvQ', c:'shake'};
  }
  if (M.answered && M.pos === M.qs.length - 1){ M.finished = true; cvRecord(g, st); }
  R();
}

/* ---- modalidade 3: monte sua tabela ---- */
function cvBuild(s, g, st, body){
  const M = st.m3, th = THEME(), gk = CV_ORDER3[M.gi], L = CV_LAD[gk];

  const fat = M.fator[gk];

  const tries = M.tries[gk] || 0;
  body.innerHTML = `<section class="card vcard cvm3">

    <div class="qlabel">Sua tabela ${res ? '✓' : ''}</div>

    <div class="cvpool">${pool.map(u => `<button class="cvchip ${M.sel === 'u:' + u ? 'sel' : ''}" data-u="${esc(u)}" style="border-color:${L.cor};color:${L.cor}">${u}</button>`).join('') || '<span class="hint">Toque numa casa preenchida para tirar a unidade de lá.</span>'}</div>`}
    <div class="qlabel">Cada degrau da tabela vale…</div>
    <div class="chips">${[10, 100, 1000].map(f => `<button class="chip ${fat === f ? (checked || res ? (f === L.f ? 'good' : 'badc') : 'on') : ''}" data-fat="${f}" ${res ? 'disabled' : ''}>× ${fmtN(f)} ou ÷ ${fmtN(f)}</button>`).join('')}</div>
    <div class="gbtns">${res ? (Object.keys(M.res).length < 5 ? `<button class="btn" id="cvNextG" style="background:var(--sc)">Próxima grandeza →</button>` : `<button class="btn sec" id="cvGoMenu">☰ Outra modalidade</button>`) : `<button class="btn" id="cvVer" style="background:var(--sc)">Verificar</button><button class="btn sec" id="cvLimpar">Limpar</button>${tries >= 2 ? `<button class="btn sec" id="cvMostra">👀 Ver a tabela certa</button>` : ''}`}</div>
    <div id="ciFb">${M.fb || ''}</div>
    ${Object.keys(M.res).length === 5 ? `<div class="fbk ok" style="margin-top:8px">🏁 <b>${th.fim}</b> Você montou as 5 tabelas: ${th.pt(cvScore(st, 3))} de 5 na primeira verificação.</div>` : ''}
    <div class="hint" style="margin-top:8px">Como preencher: toque numa unidade e depois numa casa (ou toque na casa e depois na unidade). Toque numa casa preenchida para tirar a unidade.</div>
  </section>`;
  // pede confirmação só no meio da atividade; terminada (5 tabelas), recomeça direto
  cvBindHead(s, g, st, body, 3, Object.keys(M.res).length < 5 && (Object.keys(M.res).length > 0 || Object.values(M.slots).some(a => a && a.some(Boolean))));
  const R = () => cvBuild(s, g, st, body);
  const place = (u, i) => { const old = slots.indexOf(u); if (old >= 0) slots[old] = null; slots[i] = u; M.sel = null; if (checked){ M.checked[gk] = false; } M.fb = ''; savePlay(); R(); };
  $$('[data-gk]', body).forEach(b => b.onclick = () => { M.gi = +b.dataset.gk; M.sel = null; M.fb = ''; R(); });
  $$('[data-u]', body).forEach(b => b.onclick = () => {
    const u = b.dataset.u;
    if (M.sel && M.sel.startsWith('slot')) return place(u, +M.sel.slice(4));
    M.sel = M.sel === 'u:' + u ? null : 'u:' + u; R();
  });
  $$('[data-slot]', body).forEach(b => b.onclick = () => {
    const i = +b.dataset.slot;
    if (M.sel && M.sel.startsWith('u:')) return place(M.sel.slice(2), i);
    if (slots[i]){ slots[i] = null; M.checked[gk] = false; M.fb = ''; savePlay(); return R(); }   // corrige: tira a unidade da casa
    M.sel = M.sel === 'slot' + i ? null : 'slot' + i; R();
  });
  $$('[data-fat]', body).forEach(b => b.onclick = () => { M.fator[gk] = +b.dataset.fat; M.checked[gk] = false; M.fb = ''; savePlay(); R(); });
  if ($('#cvLimpar')) $('#cvLimpar').onclick = () => { M.slots[gk] = [null, null, null, null, null, null, null]; M.fator[gk] = null; M.checked[gk] = false; M.sel = null; M.fb = ''; savePlay(); R(); };
  if ($('#cvVer')) $('#cvVer').onclick = () => {
    if (slots.some(x => !x)){ M.fb = '<div class="fbk warn">Coloque as 7 unidades na tabela antes de verificar.</div>'; return R(); }
    if (!fat){ M.fb = '<div class="fbk warn">Escolha também quanto vale cada degrau.</div>'; return R(); }
    const certos = slots.filter((u, i) => u === L.u[i]).length, okF = fat === L.f;

      st.anim = {sel:'#cvSlots', c:'pop'};

      M.fb = `<div class="fbk warn">🔎 <b>${certos} de 7</b> unidades no lugar certo${okF ? '' : ' e o valor do degrau não confere'}.${certos < 7 ? ' As casas em vermelho podem ser corrigidas: toque nelas para tirar a unidade.' : ' A ordem está certa: falta corrigir quanto vale cada degrau.'}<br>${certos < 7 ? pref : ''} ${okF ? '' : `Pense nas dimensões: ${L.dim ? `${L.nome.toLowerCase()} tem ${L.dim}` : `${L.nome.toLowerCase()} anda de 10 em 10, como o comprimento`}.`}</div>`;
      st.anim = {sel:'#cvSlots', c:'shake'};

    savePlay(); R();

  if ($('#cvMostra')) $('#cvMostra').onclick = () => { M.slots[gk] = L.u.slice(); M.fator[gk] = L.f; M.res[gk] = {first:false}; M.checked[gk] = true; M.fb = `<div class="fbk no">📘 <b>Veja a tabela certa:</b> ${L.u.join(' → ')}, cada degrau × ${fmtN(L.f)}. Volte a ela depois e tente montar de novo pelo Recomeçar.</div>`; if (Object.keys(M.res).length === 5) cvRecord(g, st); savePlay(); R(); };
  if ($('#cvNextG')) $('#cvNextG').onclick = () => { const nx = CV_ORDER3.findIndex(k => !M.res[k]); M.gi = nx >= 0 ? nx : M.gi; M.fb = ''; M.sel = null; R(); };
  if ($('#cvGoMenu')) $('#cvGoMenu').onclick = () => { st.mode = null; cvRender(s, g, st, body); };
}
// embaralha as unidades de cada grandeza uma vez e guarda a ordem
function shuffleOnce(M, gk, arr){ M.pools = M.pools || {}; if (!M.pools[gk]) { let p; do { p = shuffle(arr); } while (p.join() === arr.join()); M.pools[gk] = p; } return M.pools[gk]; }

/* =========================================================
   GEOGRAFIA · JOGOS INTERATIVOS
   gsort  = arrastar cartões para as esferas
   gseq   = ordenar em casas numeradas (trilha / escada)
   gmap   = tocar a cidade certa no mapa
   gmatch = ligar conceito e descrição
   ========================================================= */
// arrastar (com o dedo ou o mouse) ou tocar: usado pelos jogos de Geografia
function dragTap(el, targetSel, body, onDrop, onTap){
  let d = null, ghost = null;
  const clear = () => { if (ghost){ ghost.remove(); ghost = null; } $$(targetSel, body).forEach(c => c.classList.remove('hov')); };
  const at = (x, y) => { const e = document.elementFromPoint(x, y); const t = e && e.closest(targetSel); return t && body.contains(t) ? t : null; };
  el.onpointerdown = e => { if (e.button > 0) return; d = {x: e.clientX, y: e.clientY, moved: false}; try { el.setPointerCapture(e.pointerId); } catch(_){} };
  el.onpointermove = e => {
    if (!d) return;
    if (!d.moved && Math.hypot(e.clientX - d.x, e.clientY - d.y) > 6){
      d.moved = true; const r = el.getBoundingClientRect(); d.ox = e.clientX - r.left; d.oy = e.clientY - r.top;
      ghost = el.cloneNode(true); ghost.classList.add('sghost'); ghost.style.width = r.width + 'px'; document.body.appendChild(ghost); el.classList.add('dragging');
    }
    if (d.moved){
      e.preventDefault();
      ghost.style.transform = `translate(${e.clientX - d.ox}px, ${e.clientY - d.oy}px) rotate(-3deg)`;
      const t = at(e.clientX, e.clientY); $$(targetSel, body).forEach(c => c.classList.toggle('hov', c === t));
      if (e.clientY > innerHeight - 50) window.scrollBy(0, 12); else if (e.clientY < 50) window.scrollBy(0, -12);
    }
  };
  el.onpointerup = e => { if (!d) return; const dd = d; d = null; const t = dd.moved ? at(e.clientX, e.clientY) : null; clear(); el.classList.remove('dragging'); if (dd.moved){ if (t) onDrop(t); } else onTap(); };
  el.onpointercancel = () => { d = null; clear(); el.classList.remove('dragging'); };
  el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); onTap(); } };
}
const ptsWord = () => isKid() ? (USER.kid === 'joao' ? 'gol ⚽' : 'estrela ✦') : 'ponto';
const gScroll = body => window.scrollTo(0, Math.max(0, body.getBoundingClientRect().top + scrollY - 70));

/* ---- Quatro esferas: arrastar para a esfera ---- */
function gsNew(g){ return {kind:'gsort', order: ciOrder(g), placed:{}, tr:{}, score:0, sel:null, fb:'', i:0}; }
function gsRender(s, g, st, body){
  const th = THEME(), N = g.items.length;
  st.i = Object.keys(st.placed).length;

    <div class="gin">${st.order.filter(i => st.placed[i] && st.placed[i].col === ci).map(i => card(i, true)).join('')}</div></div>`).join('');
  const fim = st.i === N;

    <div class="rule"><b>Como jogar:</b> arraste o cartão até a esfera, ou toque no cartão e depois na esfera. A paisagem mostra onde cada esfera fica. Acertou de primeira = 1 ${ptsWord()}. Errou? Vem uma dica; no 2º erro o cartão vai sozinho para o lugar certo (📘).</div>
    <div class="gsill">${GI(g.ill)}</div>
    <div class="prog"><i style="width:${Math.round(st.i/N*100)}%"></i></div>
    <div class="qlabel">Cartões para classificar (${pool.length})</div>
    <div class="spool">${pool.map(i => card(i, false)).join('') || '<div class="hint">Todos os cartões estão nas esferas!</div>'}</div>
    <div class="gboard" id="gBoard">${cols}</div>
    <div id="ciFb">${st.fb || ''}</div>
    ${fim ? `<div class="fbk ok" style="margin-top:8px">🏁 <b>${th.fim}</b> ${th.pt(st.score)} de ${N} de primeira.${ciRecTxt(g, st)}</div><div class="gbtns"><button class="btn" id="ciAgain" style="background:var(--sc)">🔁 Jogar de novo</button></div>` : ''}
    ${focusHTML(g)}
  </section>`;
  ciBind(s, g, st, body);
  $$('.spool .gcx', body).forEach(el => { const i = +el.dataset.c;
    dragTap(el, '.gcol', body, t => gsDrop(s, g, st, body, i, +t.dataset.col), () => { st.sel = st.sel === i ? null : i; gsRender(s, g, st, body); }); });
  $$('.gcol', body).forEach(c => c.onclick = () => { if (st.sel != null) gsDrop(s, g, st, body, st.sel, +c.dataset.col); else if (st.i < N) toast('Primeiro escolha um cartão.'); });
  if ($('#ciAgain')) $('#ciAgain').onclick = () => { const k = gmKey(s, g.id); GMS[k] = CIK.gsort.create(g); gsRender(s, g, GMS[k], body); };
}
function gsDrop(s, g, st, body, i, ci){
  const it = g.items[i], th = THEME(), certa = g.cols.findIndex(c => c[0] === it.t);
  st.sel = null;
  if (ci === certa){
    const first = !st.tr[i]; st.placed[i] = {col: ci, first}; if (first) st.score++;
    st.fb = `<div class="fbk ok"><b>${first ? th.ok : th.ok2}</b> ${it.ic} ${esc(it.n)} → <b>${it.t}</b>: ${esc(it.why)}.</div>`;
    st.anim = {sel:'#gs' + i, c:'pop'}; toast(th.ok);
  } else {
    st.tr[i] = (st.tr[i] || 0) + 1;
    if (st.tr[i] === 1){
      st.fb = `<div class="fbk warn">🔎 <b>Ainda não.</b> ${esc(it.dica || `Pergunte: "${it.n}" é água, rocha ou solo, ar ou um ser vivo?`)} Tente outra esfera.</div>`;
      st.anim = {sel:'#gcol' + ci, c:'shake'}; toast('🔎 Ainda não. Leia a dica.');
    } else {
      st.placed[i] = {col: certa, first: false};
      st.fb = `<div class="fbk no">📘 <b>Veja:</b> ${it.ic} ${esc(it.n)} fica na <b>${it.t}</b>: ${esc(it.why)}.</div>`;
      st.anim = {sel:'#gs' + i, c:'pop'};
    }
  }
  if (Object.keys(st.placed).length === g.items.length) ciRecord(g, st, st.score);
  gsRender(s, g, st, body);
}

/* ---- Coloque em ordem: casas numeradas ---- */
function gqPool(n){ let p; do { p = shuffle([...Array(n).keys()]); } while (n > 1 && p.every((v, i) => v === i)); return p; }
function gqNew(g){ const n = g.items[0].seq.length; return {kind:'gseq', pos:0, slots: Array(n).fill(null), pool: gqPool(n), sel:null, tries:0, answered:false, first:0, done:0, fb:'', marks:null, finished:false, i:0}; }
function gqRender(s, g, st, body){
  const th = THEME(), N = g.items.length, it = g.items[st.pos], n = it.seq.length;
  st.i = st.done + (st.slots.some(x => x != null) ? 1 : 0);
  const free = st.pool.filter(k => !st.slots.includes(k));
  const chip = k => `<div class="gqc gdrag ${st.sel === k ? 'sel' : ''}" data-k="${k}" tabindex="0" role="button"><span class="e">${it.seq[k][0]}</span><b>${esc(it.seq[k][1])}</b></div>`;
  const slot = (k, i) => { const m = st.marks ? st.marks[i] : null; const v = st.slots[i];
    return `<div class="gqs ${v != null ? 'full' : ''} ${m === true ? 'ok' : m === false ? 'bad' : ''}" data-s="${i}" style="${it.layout === 'escada' ? `width:${100 - i * (40 / (n - 1))}%` : ''}"><span class="num">${i + 1}º</span>${v != null ? `<span class="e">${it.seq[v][0]}</span><b>${esc(it.seq[v][1])}</b>` : '<em>solte aqui</em>'}</div>`; };
  const slotsHTML = it.layout === 'escada'
    ? `<div class="gqesc"><div class="gqend">⬆️ ${esc(it.ini)}</div>${it.seq.map(slot).join('')}<div class="gqend">⬇️ ${esc(it.fim)}</div></div>`
    : `<div class="gqtri"><div class="gqend">${it.ei || '🌿'} ${esc(it.ini)}</div><div class="gqrow">${it.seq.map((x, i) => slot(x, i) + (i < n - 1 ? '<span class="gqar">→</span>' : '')).join('')}</div><div class="gqend">${it.ef || '🗑️'} ${esc(it.fim)}</div></div>`;
  const ill = it.ill && (it.ill === 'rede' || st.answered) ? `<div class="gsill">${GI(it.ill)}</div>` : '';
  body.innerHTML = `<section class="card vcard">
    ${qhead(`${g.em} ${esc(g.title)}`, esc(g.desc), ciTools(th.pt(st.first)), g.tag)}
    <div class="rule"><b>Como jogar:</b> arraste cada cartão até uma casa, ou toque no cartão e depois na casa. Toque numa casa preenchida para tirar o cartão. Depois toque em <b>Verificar</b>: as casas certas ficam verdes e as erradas, vermelhas.</div>
    <div class="prog"><i style="width:${st.finished ? 100 : Math.round(st.pos/N*100)}%"></i></div>
    <div class="hint" style="margin:0">Sequência ${st.pos + 1} de ${N}</div>
    <div class="qname">${esc(it.q)}</div>
    ${ill}
    ${slotsHTML}
    ${st.answered ? '' : `<div class="qlabel">Cartões ${free.length ? '' : '(todos colocados)'}</div><div class="spool">${free.map(chip).join('') || '<span class="hint">Toque em Verificar.</span>'}</div>`}
    <div class="gbtns">${!st.answered ? `<button class="btn" id="gqOk" style="background:var(--sc)">Verificar</button><button class="btn sec" id="gqClr">Limpar</button>${st.tries >= 2 ? '<button class="btn sec" id="gqShow">👀 Ver a ordem certa</button>' : ''}`
      : !st.finished ? `<button class="btn" id="gqNext" style="background:var(--sc)">Próxima sequência →</button>` : `<button class="btn" id="ciAgain" style="background:var(--sc)">🔁 Jogar de novo</button>`}</div>
    <div id="ciFb">${st.fb || ''}</div>
    ${st.finished ? `<div class="fbk ok" style="margin-top:8px">🏁 <b>${th.fim}</b> ${th.pt(st.first)} de ${N} sequências de primeira.${ciRecTxt(g, st)}</div>` : ''}
    ${focusHTML(g)}
  </section>`;
  ciBind(s, g, st, body);
  const R = () => gqRender(s, g, st, body);
  const put = (k, i) => { const old = st.slots.indexOf(k); if (old >= 0) st.slots[old] = null; st.slots[i] = k; st.sel = null; st.marks = null; st.fb = ''; R(); };
  $$('.spool .gqc', body).forEach(el => { const k = +el.dataset.k;
    dragTap(el, '.gqs', body, t => put(k, +t.dataset.s), () => { st.sel = st.sel === k ? null : k; R(); }); });
  if (!st.answered) $$('.gqs', body).forEach(c => c.onclick = () => { const i = +c.dataset.s;
    if (st.sel != null) return put(st.sel, i);
    if (st.slots[i] != null){ st.slots[i] = null; st.marks = null; st.fb = ''; R(); } });
  if ($('#gqClr')) $('#gqClr').onclick = () => { st.slots = Array(n).fill(null); st.marks = null; st.sel = null; st.fb = ''; R(); };
  if ($('#gqOk')) $('#gqOk').onclick = () => {
    if (st.slots.some(x => x == null)){ st.fb = '<div class="fbk warn">Coloque todos os cartões nas casas antes de verificar.</div>'; return R(); }
    st.marks = st.slots.map((k, i) => k === i);
    const ok = st.marks.filter(Boolean).length;
    if (ok === n){
      const first = st.tries === 0; st.answered = true; st.done++; if (first) st.first++;
      st.fb = `<div class="fbk ok"><b>${first ? th.ok : th.ok2}</b> ${esc(it.why)}</div>`; st.anim = {sel:'.gqtri, .gqesc', c:'pop'};
      if (st.pos === N - 1){ st.finished = true; ciRecord(g, st, st.first); }
    } else {
      st.tries++;
      st.fb = `<div class="fbk warn">🔎 <b>${ok} de ${n}</b> no lugar certo. Toque nas casas vermelhas para tirar o cartão e tente de novo.<br><b>Dica:</b> ${esc(it.dica)}</div>`;
      st.anim = {sel:'.gqtri, .gqesc', c:'shake'};
    }
    R();
  };
  if ($('#gqShow')) $('#gqShow').onclick = () => { st.slots = [...Array(n).keys()]; st.marks = st.slots.map(() => true); st.answered = true; st.done++; st.fb = `<div class="fbk no">📘 <b>Veja a ordem certa:</b> ${esc(it.why)}</div>`; if (st.pos === N - 1){ st.finished = true; ciRecord(g, st, st.first); } R(); };
  if ($('#gqNext')) $('#gqNext').onclick = () => { st.pos++; const m = g.items[st.pos].seq.length; Object.assign(st, {slots: Array(m).fill(null), pool: gqPool(m), sel:null, tries:0, answered:false, fb:'', marks:null}); R(); gScroll(body); };
  if ($('#ciAgain')) $('#ciAgain').onclick = () => { const k = gmKey(s, g.id); GMS[k] = CIK.gseq.create(g); gqRender(s, g, GMS[k], body); };
}

/* ---- Para onde vamos?: tocar a cidade no mapa ---- */
const GM_CITY = {met:[294,50,30,'Metrópole Azul','metrópole',3,'#1f4f5c'], cap:[192,98,22,'Capital Regional Sol','capital regional',2,'#2e6f80'], rio:[96,126,15,'Cidade Rio Verde','centro sub-regional',1,'#5aa0b5'],
  lag:[44,170,10,'Vila Lagoa','centro local',0,'#9fc4d1'], ser:[150,174,10,'Vila Serra','centro local',0,'#9fc4d1'], mar:[276,160,10,'Vila Mar','centro local',0,'#9fc4d1']};
const GM_ROADS = [['met','cap'],['cap','rio'],['cap','mar'],['rio','lag'],['rio','ser']];
const GM_ROUTE = ['lag','rio','cap','met'];
function gmMapSVG(st, it){
  const route = st.answered ? GM_ROUTE.slice(0, GM_ROUTE.indexOf(it.c) + 1) : [];
  let g = `<rect width="360" height="210" rx="14" fill="#f6efe2"/>`;
  g += GM_ROADS.map(([a, b]) => { const on = route.includes(a) && route.includes(b); return `<line x1="${GM_CITY[a][0]}" y1="${GM_CITY[a][1]}" x2="${GM_CITY[b][0]}" y2="${GM_CITY[b][1]}" stroke="${on ? '#2e9e6b' : '#c9a96a'}" stroke-width="${on ? 8 : 6}" stroke-linecap="round" ${on ? 'stroke-dasharray="2 10"' : ''}/>`; }).join('');
  g += Object.entries(GM_CITY).map(([k, [x, y, r, nome, nivel, lv, cor]]) => {
    const st2 = st.answered && k === it.c ? 'okc' : (st.wrongs || []).includes(k) ? 'badc' : '';
    return `<g class="gcity ${st2}" data-city="${k}" tabindex="0" role="button" aria-label="${nome}"><circle cx="${x}" cy="${y}" r="${r + 9}" fill="transparent"/><circle class="cc" cx="${x}" cy="${y}" r="${r}" fill="${cor}" stroke="#fff" stroke-width="3"/>
      <text x="${x}" y="${y + r + 14}" text-anchor="middle" font-size="11.5" font-weight="900" fill="#1f4f5c" font-family="Nunito,sans-serif">${nome}</text>
      ${st.answered ? `<text x="${x}" y="${y + r + 26}" text-anchor="middle" font-size="9.5" font-weight="800" fill="#5f7680" font-family="Nunito,sans-serif">${nivel}</text>` : ''}</g>`; }).join('');
  g += `<text x="18" y="176" text-anchor="middle" font-size="16">🏠</text>`;   // casa da família, ao lado da Vila Lagoa
  return `<svg viewBox="0 0 360 214" class="gmap" role="img" aria-label="mapa da rede de cidades">${g}</svg>`;
}
function gmNew(){ return {kind:'gmap', pos:0, tries:0, answered:false, first:0, done:0, fb:'', wrongs:[], finished:false, i:0}; }
function gmRender(s, g, st, body){
  const th = THEME(), N = g.items.length, it = g.items[st.pos];
  st.i = st.done;
  body.innerHTML = `<section class="card vcard">
    ${qhead(`${g.em} ${esc(g.title)}`, esc(g.desc), ciTools(th.pt(st.first)), g.tag)}
    <div class="rule"><b>Como jogar:</b> o tamanho do círculo mostra quantos serviços a cidade oferece. Toque no mapa a cidade <b>mais perto</b> da Vila Lagoa 🏠 que oferece o serviço. Acertou de primeira = 1 ${ptsWord()}.</div>
    <div class="prog"><i style="width:${st.finished ? 100 : Math.round(st.pos/N*100)}%"></i></div>
    <div class="qwrap"><div class="sbox gmapbox" id="gmMap">${gmMapSVG(st, it)}</div>
      <div><div class="hint" style="margin:0">Situação ${st.pos + 1} de ${N}</div>
        <div class="scene" id="gmQ"><div class="em">${it.ic}</div><div class="tx">${esc(it.s)}</div></div>
        <div class="hint" style="margin:8px 0 0">A família mora na Vila Lagoa 🏠. Para onde ela precisa ir? <b>Toque no mapa.</b></div>
        <div class="gmleg"><span><i style="width:22px;height:22px;background:#1f4f5c"></i>metrópole</span><span><i style="width:17px;height:17px;background:#2e6f80"></i>capital regional</span><span><i style="width:12px;height:12px;background:#5aa0b5"></i>centro sub-regional</span><span><i style="width:8px;height:8px;background:#9fc4d1"></i>centro local</span></div>
        <div class="gbtns">${st.answered ? (!st.finished ? `<button class="btn" id="gmNext" style="background:var(--sc)">Próxima situação →</button>` : `<button class="btn" id="ciAgain" style="background:var(--sc)">🔁 Jogar de novo</button>`) : ''}</div>
      </div></div>
    <div id="ciFb">${st.fb || ''}</div>
    ${st.finished ? `<div class="fbk ok" style="margin-top:8px">🏁 <b>${th.fim}</b> ${th.pt(st.first)} de ${N} de primeira. Repare: pela estrada, a Vila Lagoa → Rio Verde → Capital Regional Sol → Metrópole Azul sobe um nível de cada vez.${ciRecTxt(g, st)}</div>` : ''}
    ${focusHTML(g)}
  </section>`;
  ciBind(s, g, st, body);
  const R = () => gmRender(s, g, st, body);
  if (!st.answered) $$('.gcity', body).forEach(c => { const pick = () => gmPick(s, g, st, body, c.dataset.city); c.onclick = pick; c.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); pick(); } }; });
  if ($('#gmNext')) $('#gmNext').onclick = () => { Object.assign(st, {pos: st.pos + 1, tries:0, answered:false, fb:'', wrongs:[]}); R(); gScroll(body); };
  if ($('#ciAgain')) $('#ciAgain').onclick = () => { const k = gmKey(s, g.id); GMS[k] = CIK.gmap.create(g); gmRender(s, g, GMS[k], body); };
}
function gmPick(s, g, st, body, k){
  const th = THEME(), it = g.items[st.pos], C = GM_CITY[k], A = GM_CITY[it.c];
  if (k === it.c){
    const first = st.tries === 0; st.answered = true; st.done++; if (first) st.first++;
    st.fb = `<div class="fbk ok"><b>${first ? th.ok : th.ok2}</b> ${it.ic} ${esc(it.s)}: <b>${A[3]}</b> (${esc(it.why)}). O caminho verde mostra a estrada desde a Vila Lagoa.</div>`;
    st.anim = {sel:'#gmMap', c:'pop'}; toast(th.ok);
  } else if (st.tries === 0){
    st.tries = 1; st.wrongs = [k];
    let dica;
    if (k === 'ser' || k === 'mar') dica = A[5] === 0 ? `A ${C[3]} é uma vila do mesmo tamanho; o pão e o leite a família compra na própria Vila Lagoa.` : `A ${C[3]} é uma vila pequena e fica em outro caminho. Siga a estrada que sai da Vila Lagoa e suba um nível de cada vez.`;
    else if (C[5] < A[5]) dica = `A ${C[3]} (${C[4]}) não oferece esse serviço: ele é mais especializado. Suba mais um nível pela estrada.`;
    else dica = `A ${C[3]} tem esse serviço, mas existe uma cidade <b>mais perto</b> da Vila Lagoa que também tem. Desça um nível.`;
    st.fb = `<div class="fbk warn">🔎 <b>Ainda não.</b> ${dica}</div>`; st.anim = {sel:'#gmMap', c:'shake'}; toast('🔎 Ainda não. Leia a dica.');
  } else {
    st.answered = true; st.done++; st.wrongs = (st.wrongs || []).concat([k]);
    st.fb = `<div class="fbk no">📘 <b>Veja a resposta:</b> ${it.ic} ${esc(it.s)}: <b>${A[3]}</b> (${esc(it.why)}). Siga o caminho verde no mapa.</div>`; st.anim = {sel:'#gmMap', c:'shake'};
  }
  if (st.answered && st.pos === g.items.length - 1){ st.finished = true; ciRecord(g, st, st.first); }
  gmRender(s, g, st, body);
}

/* ---- Ligue os conceitos ---- */
function gxRound(g, r){ const n = g.items[r].pairs.length; return {cOrd: shuffle([...Array(n).keys()]), dOrd: gqPool(n), matched:{}, tr:{}}; }
function gxNew(g){ return {kind:'gmatch', round:0, R: gxRound(g, 0), sel:null, first:0, done:0, fb:'', finished:false, i:0}; }
function gxRender(s, g, st, body){
  const th = THEME(), RD = g.items[st.round], P = RD.pairs, total = g.total;
  st.i = st.done;
  const roundDone = Object.keys(st.R.matched).length === P.length;
  const conc = st.R.cOrd.map(c => { const m = st.R.matched[c];
    return `<div class="gxc ${m ? (m.first ? 'okp' : 'shown') : 'gdrag'} ${st.sel === c ? 'sel' : ''}" id="gxc${c}" data-c="${c}" ${m ? '' : 'tabindex="0" role="button"'}><span class="e">${P[c][0]}</span><b>${esc(P[c][1])}</b>${m ? `<i>${m.first ? '✓' : '📘'}</i>` : ''}</div>`; }).join('');
  const desc = st.R.dOrd.map(d => { const m = st.R.matched[d];
    return `<div class="gxd ${m ? (m.first ? 'okp' : 'shown') : ''}" id="gxd${d}" data-d="${d}" ${m ? '' : 'tabindex="0" role="button"'}>${m ? `<span class="tagm">${P[d][0]} ${esc(P[d][1])}</span>` : ''}${esc(P[d][2])}</div>`; }).join('');
  body.innerHTML = `<section class="card vcard">
    ${qhead(`${g.em} ${esc(g.title)}`, esc(g.desc), ciTools(th.pt(st.first)), g.tag)}
    <div class="rule"><b>Como jogar:</b> toque num conceito (ele fica amarelo) e depois na descrição certa, ou arraste o conceito até a descrição. Ligou certo de primeira = 1 ${ptsWord()}. Errou? Vem a pista do conceito; no 2º erro a ligação aparece (📘).</div>
    <div class="prog"><i style="width:${Math.round(st.done/total*100)}%"></i></div>
    <div class="hint" style="margin:0">Rodada ${st.round + 1} de ${g.items.length} · ${esc(RD.titulo)} · ${st.done}/${total} ligações</div>
    <div class="gxwrap"><div class="gxcol"><div class="qlabel">Conceitos</div>${conc}</div><div class="gxcol"><div class="qlabel">Descrições</div>${desc}</div></div>
    <div id="ciFb">${st.fb || ''}</div>
    <div class="gbtns">${roundDone ? (st.round < g.items.length - 1 ? `<button class="btn" id="gxNext" style="background:var(--sc)">Próxima rodada →</button>` : `<button class="btn" id="ciAgain" style="background:var(--sc)">🔁 Jogar de novo</button>`) : ''}</div>
    ${st.finished ? `<div class="fbk ok" style="margin-top:8px">🏁 <b>${th.fim}</b> ${th.pt(st.first)} de ${total} ligações de primeira.${ciRecTxt(g, st)}</div>` : ''}
    ${focusHTML(g)}
  </section>`;
  ciBind(s, g, st, body);
  const R = () => gxRender(s, g, st, body);
  $$('.gxc.gdrag', body).forEach(el => { const c = +el.dataset.c;
    dragTap(el, '.gxd:not(.okp):not(.shown)', body, t => gxTry(s, g, st, body, c, +t.dataset.d), () => { st.sel = st.sel === c ? null : c; R(); }); });
  $$('.gxd:not(.okp):not(.shown)', body).forEach(el => { const go2 = () => { if (st.sel == null){ toast('Primeiro toque num conceito.'); return; } gxTry(s, g, st, body, st.sel, +el.dataset.d); }; el.onclick = go2; el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go2(); } }; });
  if ($('#gxNext')) $('#gxNext').onclick = () => { st.round++; st.R = gxRound(g, st.round); st.sel = null; st.fb = ''; R(); gScroll(body); };
  if ($('#ciAgain')) $('#ciAgain').onclick = () => { const k = gmKey(s, g.id); GMS[k] = CIK.gmatch.create(g); gxRender(s, g, GMS[k], body); };
}
function gxTry(s, g, st, body, c, d){
  const th = THEME(), P = g.items[st.round].pairs;
  st.sel = null;
  if (c === d){
    const first = !st.R.tr[c]; st.R.matched[c] = {first}; st.done++; if (first) st.first++;
    st.fb = `<div class="fbk ok"><b>${first ? th.ok : th.ok2}</b> ${P[c][0]} <b>${esc(P[c][1])}</b>: ${esc(P[c][2])}</div>`;
    st.anim = {sel:'#gxd' + d, c:'pop'}; toast(th.ok);
  } else {
    st.R.tr[c] = (st.R.tr[c] || 0) + 1;
    if (st.R.tr[c] === 1){ st.fb = `<div class="fbk warn">🔎 <b>Ainda não.</b> Essa descrição não é de "${esc(P[c][1])}". <b>Pista:</b> ${esc(P[c][3])}</div>`; st.anim = {sel:'#gxd' + d, c:'shake'}; toast('🔎 Ainda não. Leia a pista.'); }
    else { st.R.matched[c] = {first:false}; st.done++; st.fb = `<div class="fbk no">📘 <b>Veja:</b> ${P[c][0]} <b>${esc(P[c][1])}</b>: ${esc(P[c][2])}</div>`; st.anim = {sel:'#gxd' + c, c:'pop'}; }
  }
  if (st.round === g.items.length - 1 && Object.keys(st.R.matched).length === P.length){ st.finished = true; ciRecord(g, st, st.first); }
  gxRender(s, g, st, body);
}

/* =========================================================
   HISTÓRIA · JOGOS INTERATIVOS
   hline = arrastar acontecimentos para a linha do tempo
   hfit  = encaixar palavras/conceitos em zonas: pirâmide, caixas ou lacunas de frases

function hlNew(g){ return {kind:'hline', order: ciOrder(g), placed:{}, tr:{}, sel:null, score:0, fb:'', i:0, txt:true}; }

      <span class="hlsec">${p ? g.items[i].sec : 'século: ?'}</span></div>`; }).join('');
  const fim = st.i === N;
  body.innerHTML = `<section class="card vcard">

function hlDrop(s, g, st, body, i, di){
  const th = THEME(), it = g.items[i], d = g.dates[di];
  st.sel = null;
  if (d === it.a){
    const first = !st.tr[i]; st.placed[i] = {first}; if (first) st.score++; st.hl = null;
    st.fb = `<div class="fbk ok"><b>${first ? th.ok : th.ok2}</b> ${it.ic} ${esc(it.t)} → <b>${it.a}</b> (${it.sec}).</div>`;
    st.anim = {sel:'#hls' + di, c:'pop'}; toast(th.ok);
  } else {
    st.tr[i] = (st.tr[i] || 0) + 1;
    if (st.tr[i] === 1){
      st.fb = `<div class="fbk warn">🔎 <b>Ainda não.</b> Procure no texto-base a frase "<i>${esc(it.chave)}…</i>": a data está bem perto dela.</div>`;
      st.txt = true; st.hl = it.chave; st.anim = {sel:'#hls' + di, c:'shake'}; toast('🔎 Ainda não. Veja o parágrafo destacado no texto-base.');

      st.anim = {sel:'#hls' + g.dates.indexOf(it.a), c:'pop'};
    }
  }
  if (Object.keys(st.placed).length === g.items.length) ciRecord(g, st, st.score);
  hlRender(s, g, st, body);
}

function hfRound(g, r){
  const it = g.items[r];
  let zones, chips;
  if (it.layout === 'frases'){
    zones = []; chips = [];
    it.frases.forEach((f, fi) => { let bi = 0; f.replace(/\{([^}]+)\}/g, (m, w) => { zones.push({id: `f${fi}b${bi++}`, ans:[w], label: f.replace(/\{([^}]+)\}/g, (_, x) => x === w ? '____' : x)}); chips.push({t:w, ic:'', dica:(it.dicas || {})[w] || ''}); return m; }); });
    (it.sobra || []).forEach(w => chips.push({t:w, ic:'', sobra:true}));
  } else { zones = it.zones; chips = it.chips; }
  return {zones, chips, cOrd: shuffle(chips.map((_, i) => i)), place:{}, tr:{}, gone:{}};
}
function hfNew(g){ return {kind:'hfit', round:0, R: hfRound(g, 0), first:0, done:0, sel:null, fb:'', finished:false, i:0}; }
function hfRender(s, g, st, body){

  let board;

    board = `<div class="hfbox">${R.zones.map(z => zoneHTML(z, `<div class="hfl"><b>${esc(z.label)}</b>${z.sub ? `<small>${esc(z.sub)}</small>` : ''}</div>`)).join('')}</div>`;
  } else {
    let k = 0;
    board = `<div class="hffr">${RD.frases.map((f, fi) => `<p>${esc(f).replace(/\{([^}]+)\}/g, () => { const z = R.zones[k++]; const c = inZone(z.id)[0];
      return c != null ? `<span class="hfb ${R.tr[c] >= 2 ? 'shown' : 'okp'}" id="hz-${z.id}">${esc(R.chips[c].t)}</span>` : `<span class="hfb hfz" data-z="${z.id}" id="hz-${z.id}">______</span>`; })}</p>`).join('')}</div>`;
  }
  const pool = R.cOrd.filter(c => R.place[c] == null && !R.gone[c]);
  body.innerHTML = `<section class="card vcard">
    ${qhead(`${g.em} ${esc(g.title)}`, esc(g.desc), ciTools(th.pt(st.first)), g.tag)}
    <div class="rule"><b>Como jogar:</b> arraste ${RD.layout === 'frases' ? 'a palavra até o espaço da frase' : 'o cartão até o lugar certo'}, ou toque nele e depois no lugar. Encaixou certo de primeira = 1 ${ptsWord()}. Errou? Vem uma pista; no 2º erro ${RD.layout === 'frases' ? 'a palavra vai para o lugar certo (ou sai, se ela sobra)' : 'o cartão vai sozinho'} (📘).</div>
    <div class="prog"><i style="width:${Math.round(st.done / g.total * 100)}%"></i></div>
    <div class="hint" style="margin:0">Parte ${st.round + 1} de ${g.items.length} · ${esc(RD.titulo)} · ${st.done}/${g.total} encaixados</div>
